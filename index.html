window.rename=function(ev){
  popText(ev.currentTarget,'Project name',DB.project||'','',function(v){
    DB.project=v||DB.project;
    document.getElementById('proj').textContent=DB.project;
    touch();showMenu();});
};
window.exportCSV=function(){
  var cols=MAT_ROAD.filter(function(s){return s.f;}).map(function(s){return s.n;});
  var head=['Material','Category','Vendor','Vendor kind','Vendor qualified','Ordered','Received','Open NCRs'].concat(cols).join(',');
  var lines=(DB.mats||[]).map(function(m){
    var v=mfrOf(m), r=v?mfrRoad(v):null;
    var cells=[m.name,m.cat,v?v.name:'',v?KINDS[kindOf(v)].l:'',
      v?(!needsQual(v)?'Not required':(r.every(function(x){return x.state==='done';})?'Yes':'No')):'',
      m.qty?(m.qty+' '+(m.unit||'')):'',received(m),openNCR(m)]
      .concat(MAT_ROAD.filter(function(s){return s.f;}).map(function(s){
        if(!applies(s,m.cat))return '';
        var d=(m.steps||{})[s.k]||{};
        return [d.status||'',d.ref||'',d.date?show(d.date):''].filter(Boolean).join(' ');
      }));
    return cells.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');
  });
  var blob=new Blob(['\ufeff'+[head].concat(lines).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=(DB.project||'materials')+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},800);
  toast('Exported');
};
/* ---------------------------------------------------------------
   Small edits open here rather than in a browser prompt: they keep
   the page visible, they can be cancelled with Escape, and they can
   offer choices instead of asking someone to type a code correctly.
   --------------------------------------------------------------- */
var POP=null;
function pop(anchor,title,html,onOpen){
  var el=document.getElementById('pop');
  el.innerHTML='<div class="pop-t">'+esc(title)+'</div>'+html;
  el.classList.add('on');
  var r=anchor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  var left=Math.min(Math.max(10,r.left),window.innerWidth-w-10);
  var top=(r.bottom+h+10>window.innerHeight&&r.top>h+10)?(r.top-h-8):(r.bottom+8);
  el.style.left=left+'px';el.style.top=Math.max(10,top)+'px';
  POP=true;
  if(onOpen)onOpen(el);
  var f=el.querySelector('input');if(f){f.focus();f.select&&f.select();}
}
window.closePop=function(){document.getElementById('pop').classList.remove('on');POP=null;};
document.addEventListener('mousedown',function(e){
  if(!POP)return;
  if(document.getElementById('pop').contains(e.target))return;
  if(e.target.closest&&e.target.closest('[data-pop]'))return;
  closePop();
});
/* one text field, saved on Enter */
function popText(anchor,title,value,hint,onSave){
  pop(anchor,title,'<input id="pop-v" value="'+attr(value||'')+'" autocomplete="off">'
    +(hint?'<div class="pop-hint">'+hint+'</div>':'')
    +'<div class="pop-f"><button class="btn btn-p btn-s" onclick="popSave()">Save</button>'
    +'<button class="btn-q" onclick="closePop()">Cancel</button></div>');
  window.popSave=function(){var v=document.getElementById('pop-v').value.trim();closePop();onSave(v);};
  var i=document.getElementById('pop-v');
  i.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();popSave();}
    if(e.key==='Escape'){e.preventDefault();closePop();}
  });
}
/* Deleting is the one action that cannot be undone here, so it asks
   in place and the confirming button is the red one — the habit of
   pressing OK without reading has nothing to land on. */
function popConfirm(anchor,title,body,label,onYes){
  pop(anchor,title,'<div class="pop-hint" style="margin-top:0;margin-bottom:12px">'+body+'</div>'
    +'<div class="pop-f"><button class="btn btn-d btn-s" id="pop-yes">'+esc(label)+'</button>'
    +'<button class="btn-q" onclick="closePop()">Keep it</button></div>',
    function(el){el.querySelector('#pop-yes').addEventListener('click',function(){closePop();onYes();});});
}
/* a row of choices, saved on click */
function popPick(anchor,title,options,current,hint,onPick){
  pop(anchor,title,'<div class="pop-r">'+options.map(function(o,i){
      var val=(typeof o==='string')?o:o.v, lab=(typeof o==='string')?o:o.l;
      return '<button class="opt'+(val===current?' on':'')+'" data-v="'+attr(val)+'">'+esc(lab)+'</button>';
    }).join('')+'</div>'+(hint?'<div class="pop-hint">'+hint+'</div>':''),
    function(el){
      el.querySelectorAll('.opt').forEach(function(b){
        b.addEventListener('click',function(){var v=b.getAttribute('data-v');closePop();onPick(v);});
      });
    });
}
/* ---------------------------------------------------------------
   One box for the lot. Searching inside the open list is fine while
   you know where a thing is; the moment you do not, a reference or a
   batch number has to be findable without guessing which tab holds
   it. Everything a record carries is searched, down to the note on a
   consignment.
   --------------------------------------------------------------- */
function hunt(q){
  q=key(q);
  if(q.length<2)return [];
  var terms=q.split(/\s+/).filter(Boolean), out=[];
  function hit(hay){var h=key(hay);return terms.every(function(t){return h.indexOf(t)>=0;});}
  function add(tab,id,title,where,line){out.push({tab:tab,id:id,t:title,w:where,s:line});}

  (DB.mats||[]).forEach(function(m){
    var v=mfrOf(m);
    if(hit([m.name,m.ref,m.cat,v?v.name:''].join(' ')))
      add('mat',m.id,m.name,'material',[m.cat||'no category',v?v.name:'',m.ref].filter(Boolean).join(' \u00b7 '));
    Object.keys(m.steps||{}).forEach(function(k){
      var d=m.steps[k]||{}, st=MAT_ROAD.find(function(x){return x.k===k;});
      if(!st)return;
      if(hit([d.ref,d.by,d.status].join(' ')))
        add('mat',m.id,m.name,st.n,[d.status,d.ref,d.by,d.date?show(d.date):''].filter(Boolean).join(' \u00b7 '));
    });
    (m.dels||[]).forEach(function(d){
      if(hit([d.ref,d.note,d.qty,d.status].join(' ')))
        add('mat',m.id,m.name,'consignment',
          [d.status,d.ref,(d.qty?d.qty+' '+(m.unit||''):''),d.date?show(d.date):'',d.note].filter(Boolean).join(' \u00b7 '));
    });
    (m.ncrs||[]).forEach(function(n){
      if(hit([n.no,n.what,n.fix,n.status].join(' ')))
        add('mat',m.id,m.name,'non-conformance',[n.status,n.no,n.what,n.fix].filter(Boolean).join(' \u00b7 '));
    });
  });
  (DB.mfrs||[]).forEach(function(v){
    if(hit([v.name,v.country,v.site,v.scope,v.cat,KINDS[kindOf(v)].l].join(' ')))
      add('mfr',v.id,v.name,KINDS[kindOf(v)].l.toLowerCase(),
        [v.cat,v.country,v.site,v.scope].filter(Boolean).join(' \u00b7 '));
    Object.keys(v.steps||{}).forEach(function(k){
      var d=v.steps[k]||{}, st=MFR_ROAD.find(function(x){return x.k===k;});
      if(!st)return;
      if(hit([d.ref,d.by,d.status].join(' ')))
        add('mfr',v.id,v.name,st.n,[d.status,d.ref,d.by,d.date?show(d.date):''].filter(Boolean).join(' \u00b7 '));
    });
  });
  (DB.people||[]).forEach(function(p){
    if(hit([p.name,p.agency,p.disc,p.ref,p.status].join(' ')))
      add('insp',p.id,p.name||'Unnamed','inspector',
        [p.status,p.agency,p.disc,p.ref].filter(Boolean).join(' \u00b7 '));
  });
  /* one record can match on several fields; keep each field it matched
     on, since that is the thing that was actually looked for */
  var seen={};
  return out.filter(function(o){
    var k2=o.tab+o.id+o.w;
    if(seen[k2])return false;seen[k2]=1;return true;
  }).slice(0,60);
}
window.huntNow=function(){
  showHunt((document.getElementById('q')||{value:''}).value.trim());
};
window.showHunt=function(q){
  var rows=hunt(q);
  sheet('Everywhere \u201c'+esc(q)+'\u201d appears',
    rows.length
      ? '<div class="dim" style="font-size:13.5px;margin-bottom:14px">'+rows.length
        +' match'+(rows.length===1?'':'es')+' across materials, vendors and inspectors.</div>'
        +rows.map(function(o){
          return '<div class="row row-a" onclick="jump(\''+o.tab+'\','+o.id+')">'
            +'<span class="tag t-na" style="min-width:118px;text-align:center;flex-shrink:0">'+esc(o.w)+'</span>'
            +'<div style="flex:1;min-width:0"><div>'+esc(o.t)+'</div>'
            +(o.s?'<div class="dim" style="font-size:13px;margin-top:2px">'+esc(o.s)+'</div>':'')+'</div></div>';
        }).join('')
      : '<div class="dim" style="padding:26px 0;text-align:center">Nothing anywhere matches \u201c'+esc(q)+'\u201d.</div>');
};
function sheet(title,html){
  document.getElementById('sheet-t').textContent=title;
  document.getElementById('sheet-b').innerHTML=html;
  document.getElementById('ov').classList.add('on');
  var f=document.querySelector('#sheet-b input,#sheet-b select');if(f)f.focus();
}
window.closeSheet=function(){document.getElementById('ov').classList.remove('on');};
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(POP)closePop();
    else if(document.getElementById('ov').classList.contains('on'))closeSheet();
    else if(OPEN)openStep(null);
    return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='r'||e.key==='R')&&e.shiftKey){e.preventDefault();refresh();}
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')){
    e.preventDefault();
    if(TAB==='home')setTab('mat');
    document.getElementById('q').focus();}
  /* add from anywhere, including while a record is open */
  if((e.ctrlKey||e.metaKey)&&(e.key==='n'||e.key==='N')){e.preventDefault();addNew();}
});
if(!window.CATS)gmsg('The file <b>cats.js</b> was not found beside this page, so categories must be set by hand.');
</script>
