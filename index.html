}
function inspBucket(p){
  var st=p.status||'Pending';
  return st==='Approved'?'done':st==='Suspended'?'blocked':'open';
}
var BUCKETS={
  mat:[['all','All'],['open','Your move'],['waiting','With reviewer'],['blocked','Blocked'],['done','Cleared']],
  mfr:[['all','All'],['open','Not started'],['waiting','In progress'],['blocked','Lapsed'],['done','Qualified'],['exempt','C0']],
  insp:[['all','All'],['open','Pending'],['done','Approved'],['blocked','Suspended']]
};
function bucketOf(rec){
  return TAB==='mat'?matBucket(rec):TAB==='mfr'?mfrBucket(rec):inspBucket(rec);
}
function drawFilters(rows){
  var el=document.getElementById('filters');if(!el)return;
  if(TAB==='home')return el.innerHTML='';
  var n={};rows.forEach(function(r){var b=bucketOf(r);n[b]=(n[b]||0)+1;});
  el.innerHTML=BUCKETS[TAB].filter(function(b){return b[0]==='all'||n[b[0]];}).map(function(b){
    var count=b[0]==='all'?rows.length:n[b[0]];
    return '<button class="fchip" aria-pressed="'+(FILTER[TAB]===b[0])+'" onclick="setFilter(\''+b[0]+'\')">'
      +esc(b[1])+'<span class="fn">'+count+'</span></button>';
  }).join('');
}
window.setFilter=function(b){FILTER[TAB]=b;rList();};

window.rList=function(){
  counts();
  if(TAB==='home'||TAB==='cal'){var fe=document.getElementById('filters');if(fe)fe.innerHTML='';return;}
  /* the button fills in the moment there is something to add, so the
     way to create a record is visible from wherever you are */
  var typed=(document.getElementById('q')||{value:''}).value.trim();
  var plus=document.getElementById('plus');
  if(plus){
    plus.classList.toggle('ready',!!typed);
    plus.title=typed?('Add \u201c'+typed+'\u201d'):('Add a '+NOUN[TAB]);
  }
  /* a reference or a batch number lives inside a record, not in a list
     of names, so offer the wider search as soon as one turns up */
  var wider=document.getElementById('wider');
  if(wider){
    var found=typed.length>=2?hunt(typed).filter(function(o){return o.tab!==TAB||o.w!==NOUN[TAB];}).length:0;
    wider.style.display=found?'':'none';
    if(found)wider.innerHTML='Search everywhere \u2014 <b>'+found+'</b> match'+(found===1?'':'es')
      +' outside this list';
  }
  var q=key((document.getElementById('q')||{value:''}).value);
  var el=document.getElementById('list'), sel=SEL[TAB];
  if(TAB==='mat'){
    var all=(DB.mats||[]).filter(function(m){
      var v=mfrOf(m);
      return !q||key([m.name,m.ref,v?v.name:''].join(' ')).indexOf(q)>=0;
    });
    drawFilters(all);
    var rows=all.filter(function(m){return FILTER.mat==='all'||matBucket(m)===FILTER.mat;});
    rows.sort(function(a,b){var ra=matRoad(a),rb=matRoad(b);
      if((ra.at<0)!==(rb.at<0))return ra.at<0?1:-1;return ra.at-rb.at;});
    if(!rows.length)return el.innerHTML=all.length?filteredOut():blankList('material');
    el.innerHTML=rows.map(function(m){
      var r=matRoad(m), cur=r.at>=0?r.steps[r.at]:null, v=mfrOf(m);
      return '<button class="card" aria-current="'+(String(m.id)===String(sel))+'" onclick="pick('+m.id+')">'
        +'<div class="card-t">'+esc(m.name||'Untitled')+'</div>'
        +'<div class="card-s">'+esc(m.cat||'no category')+(v?' · '+esc(v.name):'')
          +' · '+(cur?('step '+(r.at+1)+' of '+r.steps.length):'cleared')+'</div>'
        +'<div class="card-b">'+r.steps.map(function(x){
            return '<i style="background:'+(x.now&&x.state==='open'?'var(--now)':stateColour(x.state))+'"></i>';}).join('')
        +'</div></button>';
    }).join('');
  }else if(TAB==='insp'){
    var all3=(DB.people||[]).filter(function(p){return !q||key([p.name,p.agency,p.disc].join(' ')).indexOf(q)>=0;});
    drawFilters(all3);
    var rows3=all3.filter(function(p){return FILTER.insp==='all'||inspBucket(p)===FILTER.insp;});
    rows3.sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
    if(!rows3.length)return el.innerHTML=all3.length?filteredOut():blankList('inspector');
    el.innerHTML=rows3.map(function(p){
      var n=assignments(p).length, st=p.status||'Pending';
      return '<button class="card" aria-current="'+(String(p.id)===String(sel))+'" onclick="pick('+p.id+')">'
        +'<div class="card-t">'+(p.name?esc(p.name):'<span style="color:var(--rail-t3)">unnamed \u2014 open to fix</span>')+'</div>'
        +'<div class="card-s">'+esc(st.toLowerCase())
          +(p.agency?' · '+esc(p.agency):'')+' · '+n+' assignment'+(n===1?'':'s')+'</div>'
        +'<div class="card-b"><i style="background:'+(st==='Approved'?'var(--ok)':st==='Suspended'?'var(--bad)':'var(--now)')+'"></i></div>'
        +'</button>';
    }).join('');
  }else{
    var all2=(DB.mfrs||[]).filter(function(v){
      return !q||key([v.name,v.country,v.scope,KINDS[kindOf(v)].l].join(' ')).indexOf(q)>=0;});
    drawFilters(all2);
    var rows2=all2.filter(function(v){return FILTER.mfr==='all'||mfrBucket(v)===FILTER.mfr;});
    var rank={blocked:0,open:1,waiting:2,done:3,exempt:4};
    rows2.sort(function(a,b){
      var d=rank[mfrBucket(a)]-rank[mfrBucket(b)];
      return d||String(a.name).localeCompare(String(b.name));});
    if(!rows2.length)return el.innerHTML=all2.length?filteredOut():blankList('vendor');
    el.innerHTML=rows2.map(function(v){
      var r=mfrRoad(v), n=matsOf(v).length;
      var bad=r.some(function(x){return x.state==='bad';});
      var done=!needsQual(v)||r.every(function(x){return x.state==='done';});
      return '<button class="card" aria-current="'+(String(v.id)===String(sel))+'" onclick="pick('+v.id+')">'
        +'<div class="card-t">'+esc(v.name||'Untitled')+'</div>'
        +'<div class="card-s">'+esc(KINDS[kindOf(v)].l.toLowerCase())+' · '
          +(bad?'something has lapsed':!needsQual(v)?'C0 — none needed':done?'qualified':'in qualification')
          +(n?(' · '+n+' material'+(n===1?'':'s')):'')+'</div>'
        +'<div class="card-b">'+r.map(function(x){return '<i style="background:'+stateColour(x.state)+'"></i>';}).join('')+'</div>'
        +'</button>';
    }).join('');
  }
};
function filteredOut(){
  var b=(BUCKETS[TAB].find(function(x){return x[0]===FILTER[TAB];})||['','that'])[1];
  return '<div class="card-none">Nothing is \u201c'+esc(b.toLowerCase())+'\u201d right now.'
    +'<div style="margin-top:12px"><button class="btn btn-s" onclick="setFilter(\'all\')">Show all</button></div></div>';
}
function blankList(w){
  var q=(document.getElementById('q')||{value:''}).value.trim();
  if(!q)return '<div class="card-none">No '+w+'s yet.<br>Type a name above and press <b>Enter</b>.</div>';
  var elsewhere=hunt(q).length;
  return '<div class="card-none">No '+w+' matches.'
    +(elsewhere?('<div style="margin-top:12px"><button class="btn btn-s" onclick="huntNow()">'
       +'Found in '+elsewhere+' other place'+(elsewhere===1?'':'s')+'</button></div>'):'')
    +'<div style="margin-top:10px"><button class="btn btn-p btn-s" onclick="addFromSearch()">Add “'+esc(q)+'”</button></div></div>';
}
window.firstKey=function(e){if(e.key==='Enter'){e.preventDefault();addFirst();}};
window.addFirst=function(){
  var el=document.getElementById('first-name');
  var n=el?el.value.trim():'';
  if(!n){if(el)el.focus();return toast('Give it a name');}
  create(n);
};
window.pick=function(id){SEL[TAB]=id;OPEN=null;rList();rPane();};
/* the search box is already the place a name is typed, so "Add" just
   sends you there rather than opening a second box that does the same */
window.addNew=function(){
  /* on the board there is no list to add to, so go where one is */
  if(TAB==='home'){setTab('mat');
    setTimeout(function(){document.getElementById('q').focus();},0);return;}
  var q=document.getElementById('q');
  var n=q.value.trim();
  if(n)return addFromSearch();
  /* the box is the whole mechanism, so point at it plainly rather than
     opening a second box that does the same thing */
  q.focus();
  q.classList.add('flash');
  setTimeout(function(){q.classList.remove('flash');},1400);
  toast('Type the '+NOUN[TAB]+' name here, then press Enter');
};
window.addFromSearch=function(){
  var q=document.getElementById('q'), n=q.value.trim();
  if(!n)return;
  var list=TAB==='mat'?DB.mats:TAB==='mfr'?DB.mfrs:DB.people;
  var hit=list.find(function(x){return key(x.name)===key(n);});
  if(hit){q.value='';pick(hit.id);return;}
  q.value='';create(n);
};
function create(n){
  n=String(n||'').trim();
  if(!n)return toast('Give it a name first');
  /* two records with the same name cannot be told apart later */
  var list=(TAB==='mat')?DB.mats:(TAB==='mfr')?DB.mfrs:DB.people;
  var twin=list.find(function(x){return key(x.name)===key(n);});
  if(twin){SEL[TAB]=twin.id;document.getElementById('q').value='';rList();rPane();
    return toast('That name is already here — opened it instead');}
  if(TAB==='mat'){
    var f=lookCat(n);
    var m={id:uid(),name:n,cat:f?topCat(f.c.c):'',catFrom:f?(f.sure?'read from Attachment 1':'closest entry in Attachment 1'):'',
      catSure:!!(f&&f.sure),ref:'',mfr:'',qty:'',unit:'',steps:{},dels:[],ncrs:[],added:today()};
    DB.mats.push(m);SEL.mat=m.id;
    touch();rList();rPane();
    toast(f?('Category '+m.cat+' — '+m.catFrom):'No match in Attachment 1 — set the category yourself');
  }else if(TAB==='insp'){
    var p={id:uid(),name:n,agency:'',disc:'',status:'Pending',ref:'',added:today()};
    DB.people.push(p);SEL.insp=p.id;
    touch();rList();rPane();
  }else{
    var v={id:uid(),name:n,kind:'maker',cat:'',country:'',site:'',scope:'',steps:{},pq:{},added:today()};
    DB.mfrs.push(v);SEL.mfr=v.id;
    touch();rList();rPane();
  }
  document.getElementById('q').value='';
}
/* every place an inspector's name has been used */
function assignments(p){
  var out=[], k=key(p.name);
  (DB.mats||[]).forEach(function(m){
    Object.keys(m.steps||{}).forEach(function(s){
      if(key(m.steps[s].by)===k)out.push({t:m.name,s:s,tab:'mat',id:m.id});});});
  (DB.mfrs||[]).forEach(function(v){
    Object.keys(v.steps||{}).forEach(function(s){
      if(key(v.steps[s].by)===k)out.push({t:v.name,s:s,tab:'mfr',id:v.id});});});
  return out;
}
window.remove=function(ev){
  var a=ev&&ev.currentTarget?ev.currentTarget:document.getElementById('add-btn');
  if(TAB==='insp'){
    var p=insp(SEL.insp);if(!p)return;
    var n=assignments(p).length;
    return popConfirm(a,'Delete '+p.name+'?',
      n?('Named on '+n+' inspection'+(n===1?'':'s')+'. Those names stay as they were typed; only this record goes.')
       :'This cannot be undone.','Delete',function(){
        DB.people=DB.people.filter(function(x){return String(x.id)!==String(p.id);});
        SEL.insp=DB.people.length?DB.people[0].id:null;
        touch();rList();rPane();});
  }
  if(TAB==='mat'){
    var m=mat(SEL.mat);if(!m)return;
    var d=(m.dels||[]).length, c=(m.ncrs||[]).length, done=matRoad(m).done;
    return popConfirm(a,'Delete '+m.name+'?',
      'Its '+done+' recorded step'+(done===1?'':'s')
      +(d?(', '+d+' consignment'+(d===1?'':'s')):'')
      +(c?(' and '+c+' non-conformance report'+(c===1?'':'s')):'')
      +' go with it. This cannot be undone.','Delete',function(){
        DB.mats=DB.mats.filter(function(x){return String(x.id)!==String(m.id);});
        SEL.mat=DB.mats.length?DB.mats[0].id:null;
        touch();rList();rPane();});
  }
  var v=mfr(SEL.mfr);if(!v)return;
  var k=matsOf(v).length;
  popConfirm(a,'Delete '+v.name+'?',
    k?('Named on '+k+' material'+(k===1?'':'s')+', which will be left without a vendor. Its qualification record goes too.')
     :'This cannot be undone.','Delete',function(){
      DB.mats.forEach(function(m){if(String(m.mfr)===String(v.id))m.mfr='';});
      DB.mfrs=DB.mfrs.filter(function(x){return String(x.id)!==String(v.id);});
      SEL.mfr=DB.mfrs.length?DB.mfrs[0].id:null;
      touch();rList();rPane();});
};
</script>

<script>
/* ================================================================
   5. THE DETAIL PANE
   ================================================================ */
function rPane(){
  var el=document.getElementById('pane');
  var id=SEL[TAB];
  if(TAB==='home')return el.innerHTML=homePane();
  if(TAB==='cal')return el.innerHTML=calPane();
  var rec=(TAB==='mat')?mat(id):(TAB==='mfr')?mfr(id):insp(id);
  if(!rec){
    var has=(TAB==='mat'?DB.mats:DB.mfrs).length;
    el.innerHTML='<div class="empty">'+(has
      ? 'Pick a '+NOUN[TAB]+' on the left.'
      : (TAB==='mat'
          ? 'Nothing here yet.<br><br>Type a material name on the left and press <b>Enter</b>. The procedure decides its category, and its steps appear in order.'
          : TAB==='mfr'
          ? 'No vendors yet.<br><br>A vendor is qualified once and serves every material you buy from it.'
          : 'No inspectors yet.<br><br>Clause 2.2.17 has SEVEN approve every inspector. Keep them here and their names become a choice rather than something retyped.'))
      +(has?'<div><button class="btn btn-p" onclick="addNew()">Add a '+NOUN[TAB]+'</button></div>'
           :'<div class="f" style="max-width:340px;margin:22px auto 0;text-align:left">'
            +'<label for="first-name">Name of the first '+NOUN[TAB]+'</label>'
            +'<input id="first-name" autocomplete="off" onkeydown="firstKey(event)">'
            +'<div class="f-act" style="justify-content:center"><button class="btn btn-p" onclick="addFirst()">Add it</button></div></div>')
      +'</div>';
    return;
  }
  el.innerHTML=(TAB==='mat')?matPane(rec):(TAB==='mfr')?mfrPane(rec):inspPane(rec);
}

/* ---------------------------------------------------------------
   The board answers one question: what should I do now. Everything
   on it is computed from the records, so it cannot say one thing
   while a material says another.
   --------------------------------------------------------------- */
function homePane(){
  var f=findings();
  var late=f.filter(function(x){return x.tone==='bad';});
  var mine=f.filter(function(x){return x.tone==='now';});
  var waiting=f.filter(function(x){return x.tone==='wait';});
  var mats=(DB.mats||[]), done=mats.filter(function(m){var r=matRoad(m);return r.at<0;}).length;
  var ncr=mats.reduce(function(a,m){return a+openNCR(m);},0);
  var hour=new Date().getHours();
  var hello=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';

  var head='<div class="head"><div class="wrap"><div class="head-t">'+hello+'</div>'
    +'<div class="head-m">'
    +(DB.project?('<span class="chip flat">'+esc(DB.project)+'</span>')
      :'<button class="chip warn" data-pop onclick="rename(event)">name this project</button>')
    +'<span class="chip flat">'+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</span>'
    +(late.length?'<span class="chip warn">'+late.length+' late</span>':'<span class="chip set">nothing late</span>')
    +'</div></div></div>';

  var cards='<div class="grid">'
    +stat(late.length,'Late',late.length?'hot':'',"jump('mat',0)")
    +stat(mine.length,'Waiting on you',mine.length?'warm':'','')
    +stat(waiting.length,'With the reviewer','','')
    +stat(mats.length,'Materials',"","setTab('mat')")
    +stat(done,'Fully cleared','',"setTab('mat')")
    +stat(ncr,'Open non-conformances',ncr?'warm':'','')
    +'</div>';

  var left='<div class="sec" style="margin-top:4px">Deal with these first</div><div class="panel"><div class="panel-b">'
    +(late.length||mine.length
      ? late.concat(mine).slice(0,10).map(feedRow).join('')
      : '<div class="dim" style="padding:20px 0;text-align:center">Nothing is late and nothing is waiting on you.</div>')
    +'</div></div>';

  var right='<div class="sec" style="margin-top:4px">The next seven days</div><div class="panel"><div class="panel-b">'+week()+'</div></div>';

  if(waiting.length)right+='<div class="sec">Sitting with the reviewer</div><div class="panel"><div class="panel-b">'
    +waiting.slice(0,6).map(feedRow).join('')+'</div></div>';

  var body=cards+'<div class="cols"><section>'+left+'</section><section>'+right+'</section></div>';

  body+='<div class="sec">Where the materials stand</div><div class="panel"><div class="panel-b">'
    +(mats.length
      ? mats.slice().sort(function(a,b){return matRoad(a).at-matRoad(b).at;}).slice(0,10).map(function(m){
          var r=matRoad(m), cur=r.at>=0?r.steps[r.at]:null;
          return '<div class="feed" onclick="jump(\'mat\','+m.id+')">'
            +'<div class="feed-m"><div class="feed-t">'+esc(m.name)+'</div>'
            +'<div class="feed-s">'+esc(m.cat||'no category')+' · '
              +(cur?('step '+(r.at+1)+' of '+r.steps.length+' — '+esc(cur.s.n)):'all steps cleared')+'</div>'
            +'<div class="rail">'+r.steps.map(function(x){
                return '<i style="background:'+(x.now&&x.state==='open'?'var(--now)':stateColour(x.state))+'"></i>';}).join('')
            +'</div></div>'
            +'<div class="feed-w"><span class="meta">'+r.done+'/'+r.steps.length+'</span></div></div>';
        }).join('')
      : '<div class="dim" style="padding:20px 0;text-align:center">No materials yet. Open <b>Materials</b> and type the first name.</div>')
    +'</div></div>';

  return head+'<div class="body"><div class="wrap">'+body+'</div></div>';
}
function stat(v,label,cls,go){
  return '<div class="stat '+cls+'"'+(go?(' onclick="'+go+'"'):'')+'>'
    +'<div class="stat-v">'+v+'</div><div class="stat-l">'+esc(label)+'</div></div>';
}
function feedRow(o){
  return '<div class="feed" onclick="jump(\''+o.tab+'\','+o.id+')">'
    +'<div class="feed-m"><div class="feed-t">'+esc(o.t)+'</div>'
    +'<div class="feed-s">'+esc(o.s)+'</div></div>'
    +'<div class="feed-w"><span class="tag t-'+o.tone+'">'+esc(o.word)+'</span></div></div>';
}
/* seven days, drawn from the same dates the steps carry */
function week(){
  var t0=today(), out=[];
  function put(date,text,tone){if(date&&date>=t0&&date<=addDays(t0,6))out.push({d:date,t:text,k:tone});}
  (DB.mfrs||[]).forEach(function(v){
    var st=v.steps||{};
    if(st.pa&&st.pa.date&&st.pa.status==='Scheduled')put(st.pa.date,'Survey · '+v.name,'now');
    if(st.iso&&st.iso.date)put(st.iso.date,'ISO expires · '+v.name,'bad');
  });
  (DB.mats||[]).forEach(function(m){
    var st=m.steps||{};
    if(st.pfm&&st.pfm.date&&st.pfm.status!=='Approved')put(st.pfm.date,'Meeting · '+m.name,'now');
    if(st.fat&&st.fat.date&&['Pending','Scheduled'].indexOf(st.fat.status)>=0)put(st.fat.date,'FAT · '+m.name,'now');
    matRoad(m).steps.forEach(function(x){
      var due=x.s.due?x.s.due(m,x.data):null;
      if(due&&!due.soft)put(due.on,x.s.n+' due · '+m.name,'bad');
    });
    (m.dels||[]).forEach(function(d){if(d.status==='Pending')put(d.date,'Inspect delivery · '+m.name,'now');});
  });
  (DB.events||[]).forEach(function(e){
    if(!e.date)return;
    occurs(e,t0,addDays(t0,6)).forEach(function(d){put(d,(e.rep?'\u21bb ':'')+e.title,EV_KIND[e.type||'other'].t);});
  });
  var days='';
  for(var i=0;i<7;i++){
    var d=addDays(t0,i), dt=new Date(d), ev=out.filter(function(x){return x.d===d;});
    days+='<div class="day'+(i===0?' today':'')+'">'
      +'<div class="day-n">'+dt.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase()+'</div>'
      +'<div class="day-d">'+dt.getDate()+'</div>'
      +ev.slice(0,3).map(function(x){
          return '<div class="day-e e-'+x.k+'" title="'+attr(x.t)+'">'+esc(x.t)+'</div>';}).join('')
      +(ev.length>3?('<div class="day-n" style="margin-top:4px">+'+(ev.length-3)+'</div>'):'')
      +'</div>';
  }
  return '<div class="week">'+days+'</div>';
}

/* ---------------------------------------------------------------
   THE CALENDAR
   Most of what belongs on a month is already written on the steps —
   a survey date, an inspection, a deadline the procedure sets — so
   it is read from them rather than typed again. What is left is
   yours: a fabrication window, a meeting, a trip. Those are the only
   ones stored, and they may hang off a material or stand alone.
   --------------------------------------------------------------- */
var CAL=new Date();CAL.setDate(1);
var EV_KIND={
  fab:{l:'Fabrication',t:'wait'}, meet:{l:'Meeting',t:'na'},
  visit:{l:'Site or factory visit',t:'wait'}, ship:{l:'Shipping',t:'ok'},
  due:{l:'Deadline',t:'now'}, other:{l:'Something else',t:'na'}
};
var EV_OPTS=Object.keys(EV_KIND).map(function(k){return {v:k,l:EV_KIND[k].l};});
var REP={'':'Does not repeat',d:'Every day',w:'Every week','2w':'Every two weeks',m:'Every month'};

function evOf(id){return (DB.events||[]).find(function(e){return String(e.id)===String(id);});}
function span(a,b,cap){var out=[],d=a,n=0;while(d<=b&&n<(cap||400)){out.push(d);d=addDays(d,1);n++;}return out;}
/* a rule becomes the days it actually lands on, for the window drawn */
function occurs(e,from,to){
  var len=e.end?Math.max(0,Math.round((new Date(e.end)-new Date(e.date))/864e5)):0;
  if(!e.rep)return span(e.date,e.end||e.date,120).filter(function(d){return d>=from&&d<=to;});
  var out=[];
  if(e.rep==='m'){
    var day=+e.date.slice(8,10);
    for(var k=-1;k<=1;k++){
      var base=new Date(+from.slice(0,4),+from.slice(5,7)-1+k,day);
      if(base.getDate()!==day)continue;
      var ds=ymd(base);
      if(ds<e.date)continue;
      span(ds,addDays(ds,len),120).forEach(function(d){if(d>=from&&d<=to)out.push(d);});
    }
    return out;
  }
  var step=e.rep==='d'?1:e.rep==='w'?7:14, first=e.date, guard=0;
  if(first<from){
    var gap=Math.floor((new Date(from)-new Date(first))/864e5);
    first=addDays(first,Math.max(0,Math.floor((gap-len)/step))*step);
  }
  var d2=first;
  while(d2<=to&&guard++<900){
    if(addDays(d2,len)>=from)span(d2,addDays(d2,len),120).forEach(function(x){if(x>=from&&x<=to)out.push(x);});
    d2=addDays(d2,step);
  }
  return out;
}
/* everything that falls in a window: what the steps already say, plus yours */
function calItems(from,to){
  var out=[];
  function put(date,title,tone,go,extra){
    if(date&&date>=from&&date<=to)out.push(Object.assign({d:date,t:title,k:tone,go:go,own:false},extra||{}));
  }
  (DB.mfrs||[]).forEach(function(v){
    var st=v.steps||{};
    if(st.pa&&st.pa.date&&st.pa.status==='Scheduled')put(st.pa.date,'Survey · '+v.name,'wait',"jump('mfr',"+v.id+")");
    if(st.iso&&st.iso.date)put(st.iso.date,'ISO expires · '+v.name,'bad',"jump('mfr',"+v.id+")");
    if(st.scope&&st.scope.date)put(st.scope.date,'Accreditation expires · '+v.name,'bad',"jump('mfr',"+v.id+")");
  });
  (DB.mats||[]).forEach(function(m){
    var st=m.steps||{}, go="jump('mat',"+m.id+")";
    if(st.pfm&&st.pfm.date&&st.pfm.status!=='Approved')put(st.pfm.date,'Pre-fab meeting · '+m.name,'na',go);
    if(st.fat&&st.fat.date)put(st.fat.date,(st.fat.status==='Scheduled'?'FAT · ':'FAT held · ')+m.name,'wait',go);
    if(st.ipi&&st.ipi.date)put(st.ipi.date,'In-process visit · '+m.name,'wait',go);
    matRoad(m).steps.forEach(function(x){
      var due=x.s.due?x.s.due(m,x.data):null;
      if(due&&!due.soft)put(due.on,x.s.n+' due · '+m.name,daysTo(due.on)<0?'bad':'now',go);
    });
    (m.dels||[]).forEach(function(d){
      if(d.date)put(d.date,(d.status==='Pending'?'Inspect delivery · ':'Delivered · ')+m.name,
        d.status==='Pending'?'now':'ok',go);
    });
  });
  (DB.events||[]).forEach(function(e){
    if(!e.date)return;
    var days=occurs(e,from,to);
    var last=e.end||e.date;
    days.forEach(function(d){
      var isStart=(days.length>1&&d===days[0])||d===e.date;
      out.push({d:d,t:e.title,k:EV_KIND[e.type||'other'].t,own:true,id:e.id,
        rep:!!e.rep, ends:last,
        pos:(!e.end||e.end===e.date)?'':(d===e.date?'start':(d===last?'end':'mid')),
        link:e.link||''});
    });
  });
  return out;
}

/* ---------------------------------------------------------------
   A material cannot pass a vendor that is not qualified, so the
   material has to say what the vendor is short of — not
   merely that something is. Anything else means opening two records
   to answer one question.
   --------------------------------------------------------------- */
function mfrState(v){
  if(!v)return {tone:'now',word:'none named',short:['No vendor named'],ok:false};
  if(!needsQual(v))return {tone:'ok',word:'no qualification needed',short:[],ok:true,v:v};
  var r=mfrRoad(v), short=[], tone='ok', word='qualified';
  r.forEach(function(x){
    var d=x.data;
    if(x.state==='done')return;
    if(x.s.k==='iso'){
      if(d.date&&daysTo(d.date)<0)short.push('ISO 9001 expired '+show(d.date));
      else if(d.status==='Expired')short.push('ISO 9001 marked expired');
      else short.push('ISO 9001 not recorded');
      return;
    }
    short.push(x.s.n+(x.state==='bad'?(' — '+String(d.status||'returned').toLowerCase())
      :x.state==='wait'?' — with the reviewer':' — not started'));
  });
  if(r.some(function(x){return x.state==='bad';})){tone='bad';word='blocked';}
  else if(short.length){tone='wait';word='in qualification';}
  /* a certificate that lapses after approval still stops the work */
  var iso=(v.steps||{}).iso||{};
  if(iso.date&&daysTo(iso.date)<0){tone='bad';word='certificate lapsed';
    if(!short.some(function(t){return /ISO/.test(t);}))short.unshift('ISO 9001 expired '+show(iso.date));}
  return {tone:tone,word:word,short:short,ok:short.length===0,v:v};
}

/* ---------- a checklist that lives on a step ---------- */
/* Two dozen tick boxes held open push everything below them off the
   screen, and they are only wanted while the file is actually being
   gone through. So it shows as one line — count, bar, what is left —
   and opens when asked. Once open it stays open for that record. */
var OPENLIST={};
function checklist(rec,bucket,items,clause,title){
  var st=rec[bucket]||{};
  var done=items.filter(function(_,i){return st['i'+i];}).length;
  var pct=items.length?Math.round(done/items.length*100):0;
  var id=rec.id+':'+bucket, open=!!OPENLIST[id];
  var left=items.length-done;

  var head='<button class="cl-head" aria-expanded="'+open+'" onclick="toggleList(\''+id+'\')">'
    +'<svg class="cl-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
    +'<div class="cl-m"><div class="cl-t">'+esc(title)+' <span class="sclause">'+esc(clause)+'</span></div>'
      +'<div class="cl-s">'+(done?(done+' of '+items.length+' ticked'+(left?(' \u00b7 '+left+' still to attach'):' \u00b7 complete'))
                                 :(items.length+' items, none ticked yet'))+'</div>'
      +'<div class="bar" style="margin-top:8px"><i style="width:'+pct+'%"></i></div></div>'
    +'<span class="meta" style="flex-shrink:0">'+done+'/'+items.length+'</span></button>';

  if(!open)return '<div class="cl">'+head+'</div>';

  return '<div class="cl open">'+head+'<div class="cl-body">'
    +items.map(function(t,i){
        var on=!!st['i'+i];
        return '<label class="cl-item">'
          +'<input type="checkbox" '+(on?'checked ':'')+'onchange="tick(\''+bucket+'\','+i+',this.checked)">'
          +'<span'+(on?' class="ticked"':'')+'>'+esc(t)+'</span></label>';
      }).join('')
    +'<div class="cl-foot">'
      +'<button class="btn btn-s" onclick="tickAll(\''+bucket+'\','+items.length+',true)">Tick all</button>'
      +(done?'<button class="btn-q" onclick="tickAll(\''+bucket+'\','+items.length+',false)">Clear</button>':'')
    +'</div></div></div>';
}
window.toggleList=function(id){OPENLIST[id]=!OPENLIST[id];rPane();};
window.tickAll=function(bucket,n,on){
  var rec=(TAB==='mat')?mat(SEL.mat):mfr(SEL.mfr);if(!rec)return;
  rec[bucket]=on?(function(){var o={};for(var i=0;i<n;i++)o['i'+i]=1;return o;})():{};
  touch();rPane();
};
window.tick=function(bucket,i,on){
  var rec=(TAB==='mat')?mat(SEL.mat):mfr(SEL.mfr);if(!rec)return;
  rec[bucket]=rec[bucket]||{};
  if(on)rec[bucket]['i'+i]=1;else delete rec[bucket]['i'+i];
  touch();rPane();
};

/* ---------- one step ---------- */
function stepCard(rec,x,i,kind){
  var st=x.s, d=x.data, state=x.state;
  var dot=state==='done'?'done':state==='bad'?'bad':state==='wait'?'wait':(x.now?'now':'');
  var editing=(OPEN===kind+':'+st.k);

  var inner='';
  if(st.linked){
    var v=mfrOf(rec), ms=mfrState(v);
    if(v&&!needsQual(v)){
      return '<div class="step"><div class="dot done">'+ICON.tick+'</div><div class="sbody">'
        +'<div class="stitle">'+esc(st.n)+'<span class="sclause">2.1.5</span></div>'
        +'<div class="swhy">Approval is required for category 1 and above. This material is C0, so its maker needs none.</div>'
        +'<div class="srec"><span class="tag t-ok">not required</span><b style="font-weight:500">'+esc(v.name)+'</b></div>'
        +'<div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn btn-s" onclick="jump(\'mfr\','+v.id+')">Open '+esc(v.name)+'</button>'
        +'<button class="btn btn-s" data-pop onclick="pickMfr(event)">Change</button></div>'
        +'</div></div>';
    }
    if(!v){
      inner='<div class="srec"><span class="tag t-now">none named</span>'
        +'<span class="dim">Approval of the vendor comes before the purchase order for anything above C0.</span></div>'
        +'<div style="margin-top:11px"><button class="btn btn-p btn-s" data-pop onclick="pickMfr(event)">Name the vendor</button></div>';
    }else{
      inner='<div class="srec"><span class="tag t-'+ms.tone+'">'+esc(ms.word)+'</span>'
        +'<b style="font-weight:500">'+esc(v.name)+'</b>'
        +(v.country?'<span class="dim">'+esc(v.country)+'</span>':'')
        +(v.site?'<span class="dim">· '+esc(v.site)+'</span>':'')+'</div>';
      /* each of its steps, with its own state, read from its record */
      inner+='<div class="srec" style="margin-top:8px">'+mfrRoad(v).map(function(y){
        var t=y.state==='done'?'ok':y.state==='bad'?'bad':y.state==='wait'?'wait':'na';
        return '<span class="tag t-'+t+'">'+esc(y.s.n)+'</span>';}).join('')+'</div>';
      if(!ms.ok)inner+='<div class="sdue '+(ms.tone==='bad'?'d-late':'d-soon')+'" style="display:flex;align-items:flex-start">'
        +ICON.alert+'<span><b>Still outstanding:</b><br>'+ms.short.map(esc).join('<br>')+'</span></div>';
      inner+='<div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn btn-s'+(ms.ok?'':' btn-p')+'" onclick="jump(\'mfr\','+v.id+')">Open '+esc(v.name)+'</button>'
        +'<button class="btn btn-s" data-pop onclick="pickMfr(event)">Change</button></div>';
    }
  }else if(st.deliveries){
    var ord=num(rec.qty), got=received(rec), n=(rec.dels||[]).length;
    inner='<div class="srec">'+(n?(n+' consignment'+(n===1?'':'s')+' recorded'+(ord?', '+got+' of '+ord+' '+esc(rec.unit||'')+' accepted':'')):'Nothing has arrived yet')+'</div>'
      +'<div style="margin-top:11px"><button class="btn '+(x.now?'btn-p ':'')+'btn-s" onclick="addDel()">Record a delivery</button></div>';
  }else{
    var bits=[];
    if(d.status)bits.push('<span class="tag t-'+(state==='done'?'ok':state==='bad'?'bad':state==='wait'?'wait':'na')+'">'+esc(d.status)+'</span>');
    if(d.ref)bits.push('<span class="mono">'+esc(d.ref)+'</span>');
    if(d.date)bits.push('<span class="dim">'+esc(dateLabel(st))+' '+show(d.date)+'</span>');
    if(d.by)bits.push('<span class="dim">'+esc(d.by)+'</span>');
    if(bits.length)inner+='<div class="srec">'+bits.join('')+'</div>';
    var due=st.due?st.due(rec,d):null;
    if(due){
      /* two different things wear a date: a deadline you can miss, and
         a permission that simply has not arrived yet. Only the first
         is ever late. */
      var n2=daysTo(due.on);
      var cls=due.soft?(n2>0?'d-soon':'d-ok'):(n2<0?'d-late':n2<=14?'d-soon':'d-ok');
      inner+='<div class="sdue '+cls+'">'+((!due.soft&&n2<0)?ICON.alert:ICON.clock)
        +'<span>'+esc(due.t)+' <b>'+show(due.on)+'</b>'+(due.soft&&n2<=0?'':' · '+when(due.on))+'</span></div>';
    }
    var warn=st.warn?st.warn(rec,d):'';
    if(warn)inner+='<div class="sdue d-soon">'+ICON.alert+'<span>'+esc(warn)+'</span></div>';
    /* an inspector who is not approved must not pass unremarked */
    if(d.by){
      var who=(DB.people||[]).find(function(p){return key(p.name)===key(d.by);});
      if(!who)inner+='<div class="sdue d-soon">'+ICON.alert+'<span><b>'+esc(d.by)+'</b> is not in your inspector list. Clause 2.2.17 has SEVEN approve every inspector.</span></div>';
      else if((who.status||'Pending')!=='Approved')
        inner+='<div class="sdue '+((who.status==='Suspended')?'d-late':'d-soon')+'">'+ICON.alert
          +'<span><b>'+esc(who.name)+'</b> is '+esc(String(who.status||'pending').toLowerCase())+', not approved.</span></div>';
    }
    inner+=editing?form(rec,st,d,kind)
      :'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn '+(x.now?'btn-p ':'')+'btn-s" onclick="openStep(\''+kind+':'+st.k+'\')">'
        +(d.status||d.ref||d.date?'Update':'Record it')+'</button>'
        /* when the detail does not matter, one press settles it */
        +((state!=='done'&&!editing)?'<button class="btn btn-s" onclick="quickDone(\''+kind+'\',\''+st.k+'\')">Mark done</button>':'')
        +'</div>';
    /* the two dossiers carry a contents list the procedure writes out */
    if(kind==='mat'&&DOSSIER[st.k]&&!editing)
      inner+=checklist(rec,st.k+'List',DOSSIER[st.k].items,DOSSIER[st.k].clause,'What it must contain');
    if(kind==='mfr'&&st.k==='pqd'&&!editing)
      inner+=checklist(rec,'pq',pqList(rec),'2.1.14','The pre-qualification file');
  }

  return '<div class="step'+(x.now?' now':'')+(x.ahead&&!editing?' ahead':'')+'">'
    +'<div class="dot '+dot+'">'+(state==='done'?ICON.tick:(i+1))+'</div>'
    +'<div class="sbody">'
      +'<div class="stitle">'+esc(st.n)+'<span class="sclause">'+esc(st.clause)+'</span></div>'
      +'<div class="swhy">'+esc(st.why)+'</div>'
      +inner
    +'</div></div>';
}
function dateLabel(st){
  var f=(st.f||[]).find(function(x){return x[0]==='date';});
  return f?f[1].toLowerCase():'on';
}
function form(rec,st,d,kind){
  var h='<div class="form">';
  st.f.forEach(function(f){
    var k=f[0],lab=f[1],ty=f[2],opts=f[3];
    h+='<div class="f'+(k==='ref'?' wide':'')+'"><label for="i-'+k+'">'+esc(lab)+'</label>';
    if(ty==='date')h+='<input class="mono" id="i-'+k+'" value="'+attr(show(d[k]))+'" placeholder="dd/mm/yyyy" autocomplete="off">';
    else if(ty==='status'||ty==='sel'){
      var list=(ty==='status')?STATUS:opts, cur=d[k]||list[0];
      h+='<select id="i-'+k+'">'+list.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
    }else if(ty==='person'){
      var people=(DB.people||[]).slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
      var cur=d[k]||'';
      var known=people.some(function(p){return key(p.name)===key(cur);});
      h+='<select id="i-'+k+'" onchange="personPicked(this)">'
        +'<option value=""'+(cur?'':' selected')+'>\u2014</option>'
        +people.map(function(p){
            return '<option value="'+attr(p.name)+'"'+(key(p.name)===key(cur)?' selected':'')+'>'
              +esc(p.name)+(p.status!=='Approved'?(' \u00b7 '+esc(String(p.status||'pending').toLowerCase())):'')
              +(p.agency?(' \u00b7 '+esc(p.agency)):'')+'</option>';}).join('')
        +(cur&&!known?'<option value="'+attr(cur)+'" selected>'+esc(cur)+' \u00b7 not on your list</option>':'')
        +'<option value="__new">Add someone new\u2026</option></select>';
    }else h+='<input id="i-'+k+'" value="'+attr(d[k]||'')+'" autocomplete="off">';
    h+='<span class="err" id="e-'+k+'"></span></div>';
  });
  h+='<div class="f-act"><button class="btn btn-p" onclick="saveStep(\''+kind+'\',\''+st.k+'\')">Save</button>'
    +'<button class="btn-q" onclick="openStep(null)">Cancel</button></div>';
  return h+'</div>'+dataList();
}
function dataList(){
  var names={};
  (DB.mats||[]).forEach(function(m){Object.keys(m.steps||{}).forEach(function(k){if(m.steps[k].by)names[m.steps[k].by]=1;});});
  (DB.mfrs||[]).forEach(function(v){Object.keys(v.steps||{}).forEach(function(k){if(v.steps[k].by)names[v.steps[k].by]=1;});});
  return '<datalist id="people">'+Object.keys(names).map(function(n){return '<option value="'+attr(n)+'">';}).join('')+'</datalist>';
}
window.personPicked=function(el){
  if(el.value!=='__new')return;
  el.value='';
  popText(el,'Inspector name','','They are added as <b>pending</b> until SEVEN approves them — clause 2.2.17.',
    function(n){
      if(!n)return;
      var p={id:uid(),name:n,agency:'',disc:'',status:'Pending',ref:'',added:today()};
      DB.people.push(p);touch();
      var opt=document.createElement('option');opt.value=n;opt.textContent=n+' \u00b7 pending';
      el.insertBefore(opt,el.lastChild);el.value=n;
      toast('Added to your inspector list as pending');
    });
};
window.openStep=function(k){
  OPEN=k;rPane();
  if(k){var f=document.querySelector('.form input,.form select');if(f)f.focus();}
};
window.quickDone=function(kind,k){
  var rec=(kind==='mat')?mat(SEL.mat):mfr(SEL.mfr);if(!rec)return;
  var st=(kind==='mat'?MAT_ROAD:MFR_ROAD).find(function(x){return x.k===k;});
  /* take the first settled word this step offers, so "done" means what
     the step itself calls done rather than a word invented here */
  var f=(st.f||[]).find(function(x){return x[0]==='status';});
  var list=f?(f[2]==='status'?STATUS:f[3]):STATUS;
  var word=list.find(function(o){return settled(o);})||'Approved';
  rec.steps=rec.steps||{};
  var d=rec.steps[k]||{};
  d.status=word;if(!d.date)d.date=today();
  rec.steps[k]=d;
  touch();rList();rPane();toast(st.n+' — '+word);
};
window.saveStep=function(kind,k){
  var rec=(kind==='mat')?mat(SEL.mat):mfr(SEL.mfr);
  if(!rec)return;
  var st=(kind==='mat'?MAT_ROAD:MFR_ROAD).find(function(x){return x.k===k;});
  var out={},bad=null;
  st.f.forEach(function(f){
    var el=document.getElementById('i-'+f[0]);if(!el)return;
    var v=el.value.trim();
    if(f[2]==='date'&&v){
      var iso=parseDate(v);
      if(iso===null){bad=bad||f[0];el.setAttribute('aria-invalid','true');
        var e=document.getElementById('e-'+f[0]);if(e)e.textContent='Use dd/mm/yyyy';return;}
      out[f[0]]=iso;
    }else out[f[0]]=v;
  });
  if(bad)return;
  rec.steps=rec.steps||{};rec.steps[k]=out;
  touch();OPEN=null;rList();rPane();
};
</script>

<script>
/* ================================================================
   6. DELIVERIES AND NON-CONFORMANCES
   A material rarely arrives all at once, and the closing dossier is
   due a week after the last quantity is accepted — so consignments
   are recorded one by one and the deadline follows from them.
   ================================================================ */
function delPanel(m){
  var dels=(m.dels||[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  var ord=num(m.qty), got=received(m);
  var pct=ord?Math.min(100,Math.round(got/ord*100)):(got?100:0);
  return '<div class="sec">Deliveries</div><div class="panel">'
    +'<div class="panel-h"><div class="panel-t">Consignments</div>'
      +'<button class="btn btn-s no-print" onclick="addDel()">Record a delivery</button></div>'
    +'<div class="panel-b">'
    +(ord?'<div style="margin-bottom:14px"><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="dim" style="font-size:12.5px;margin-top:6px">'+got+' of '+ord+' '+esc(m.unit||'')+' accepted · '+pct+'%'
      +(got<ord?(' · '+(ord-got)+' still to come'):'')+'</div></div>':'')
    +(dels.length
      ? dels.map(function(d){
          var t=settled(d.status)?'ok':failed(d.status)?'bad':'wait';
          return '<div class="line">'
            +'<span class="tag t-'+t+'">'+esc(d.status||'Pending')+'</span>'
            +'<div class="line-m"><div>'+esc(d.qty||'—')+' '+esc(m.unit||'')
              +(d.ref?' <span class="mono dim">· '+esc(d.ref)+'</span>':'')+'</div>'
            +(d.note?'<div class="dim" style="font-size:12.5px;margin-top:2px">'+esc(d.note)+'</div>':'')+'</div>'
            +'<span class="meta">'+esc(show(d.date))+'</span>'
            +'<button class="btn-q no-print" onclick="editDel('+d.id+')">Edit</button></div>';
        }).join('')
      : '<span class="dim">Nothing has arrived yet. Record each consignment as it lands, with its inspection request number.</span>')
    +'</div></div>';
}
window.addDel=function(){editDel(null);};
window.editDel=function(id){
  var m=mat(SEL.mat);if(!m)return;
  var d=(m.dels||[]).find(function(x){return String(x.id)===String(id);})||{};
  sheet(id?'Edit consignment':'Record a delivery',
     '<div class="form" style="margin:0;padding:0;border:none">'
    +fld('d-qty','Quantity received',d.qty||'','')
    +fld('d-date','Date received',show(d.date||today()),'mono')
    +fld('d-ref','Inspection request number',d.ref||'','mono')
    +'<div class="f"><label for="d-status">Outcome</label><select id="d-status">'
      +['Pending','Received','Approved with comments','Rejected'].map(function(o){
        return '<option'+((d.status||'Pending')===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'
    +'<div class="f wide"><label for="d-note">Note</label><input id="d-note" value="'+attr(d.note||'')+'" placeholder="batch or heat number, damage, shortage…"></div>'
    +'<div class="f-act"><button class="btn btn-p" onclick="saveDel('+(id||'null')+')">Save</button>'
    +'<button class="btn-q" onclick="closeSheet()">Cancel</button>'
    +(id?'<span style="flex:1"></span><button class="btn btn-d btn-s" data-pop onclick="delDel(event,'+id+')">Delete</button>':'')
    +'</div></div>');
};
function fld(id,lab,val,cls){
  return '<div class="f"><label for="'+id+'">'+esc(lab)+'</label>'
    +'<input id="'+id+'" class="'+(cls||'')+'" value="'+attr(val)+'" autocomplete="off">'
    +'<span class="err" id="e-'+id+'"></span></div>';
}
window.saveDel=function(id){
  var m=mat(SEL.mat);if(!m)return;
  var date=parseDate(document.getElementById('d-date').value);
  if(date===null){document.getElementById('e-d-date').textContent='Use dd/mm/yyyy';return;}
  var o={id:id||uid(),qty:document.getElementById('d-qty').value.trim(),date:date,
    ref:document.getElementById('d-ref').value.trim(),status:document.getElementById('d-status').value,
    note:document.getElementById('d-note').value.trim()};
  m.dels=m.dels||[];
  if(id){var i=m.dels.findIndex(function(x){return String(x.id)===String(id);});if(i>-1)m.dels[i]=o;}
  else m.dels.push(o);
  touch();closeSheet();rList();rPane();
};
window.delDel=function(ev,id){
  var m=mat(SEL.mat);if(!m)return;
  popConfirm(ev.currentTarget,'Delete this consignment?',
    'The quantity it carried is taken back off the running total.','Delete',function(){
      m.dels=(m.dels||[]).filter(function(x){return String(x.id)!==String(id);});
      touch();closeSheet();rList();rPane();});
};

function ncrPanel(m){
  var list=(m.ncrs||[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  var open=list.filter(function(n){return n.status!=='Closed';}).length;
  return '<div class="sec">Non-conformances</div><div class="panel">'
    +'<div class="panel-h"><div class="panel-t">Reports'+(open?' <span class="tag t-now" style="margin-left:8px">'+open+' open</span>':'')+'</div>'
      +'<button class="btn btn-s no-print" onclick="addNCR()">Raise one</button></div>'
    +'<div class="panel-b">'
    +(list.length
      ? list.map(function(n){
          var t=n.status==='Closed'?'ok':'bad';
          return '<div class="line">'
            +'<span class="tag t-'+t+'">'+esc(n.status||'Open')+'</span>'
            +'<div class="line-m"><div>'+(n.no?'<span class="mono">'+esc(n.no)+'</span> ':'')+esc(n.what||'')+'</div>'
            +(n.fix?'<div class="dim" style="font-size:12.5px;margin-top:2px">Disposition: '+esc(n.fix)+'</div>':'')+'</div>'
            +'<span class="meta">'+esc(show(n.date))+'</span>'
            +'<button class="btn-q no-print" onclick="editNCR('+n.id+')">Edit</button></div>';
        }).join('')
      : '<span class="dim">None raised. The closing dossier has to carry every one of these with its final disposition — clause 2.2.21.</span>')
    +'</div></div>';
}
window.addNCR=function(){editNCR(null);};
window.editNCR=function(id){
  var m=mat(SEL.mat);if(!m)return;
  var n=(m.ncrs||[]).find(function(x){return String(x.id)===String(id);})||{};
  sheet(id?'Edit the report':'Raise a non-conformance',
     '<div class="form" style="margin:0;padding:0;border:none">'
    +fld('n-no','Report number',n.no||'','mono')
    +fld('n-date','Raised',show(n.date||today()),'mono')
    +'<div class="f wide"><label for="n-what">What is wrong</label><input id="n-what" value="'+attr(n.what||'')+'"></div>'
    +'<div class="f wide"><label for="n-fix">Final disposition</label><input id="n-fix" value="'+attr(n.fix||'')+'" placeholder="repair, rework, use as is, reject"></div>'
    +'<div class="f"><label for="n-status">State</label><select id="n-status">'
      +['Open','Closed'].map(function(o){return '<option'+((n.status||'Open')===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'
    +'<div class="f-act"><button class="btn btn-p" onclick="saveNCR('+(id||'null')+')">Save</button>'
    +'<button class="btn-q" onclick="closeSheet()">Cancel</button>'
    +(id?'<span style="flex:1"></span><button class="btn btn-d btn-s" data-pop onclick="delNCR(event,'+id+')">Delete</button>':'')
    +'</div></div>');
};
window.saveNCR=function(id){
  var m=mat(SEL.mat);if(!m)return;
  var date=parseDate(document.getElementById('n-date').value);
  if(date===null){document.getElementById('e-n-date').textContent='Use dd/mm/yyyy';return;}
  var o={id:id||uid(),no:document.getElementById('n-no').value.trim(),date:date,
    what:document.getElementById('n-what').value.trim(),fix:document.getElementById('n-fix').value.trim(),
    status:document.getElementById('n-status').value};
  m.ncrs=m.ncrs||[];
  if(id){var i=m.ncrs.findIndex(function(x){return String(x.id)===String(id);});if(i>-1)m.ncrs[i]=o;}
  else m.ncrs.push(o);
  touch();closeSheet();rPane();
};
window.delNCR=function(ev,id){
  var m=mat(SEL.mat);if(!m)return;
  popConfirm(ev.currentTarget,'Delete this report?',
    'The closing dossier has to carry every non-conformance with its disposition — clause 2.2.21.','Delete',function(){
      m.ncrs=(m.ncrs||[]).filter(function(x){return String(x.id)!==String(id);});
      touch();closeSheet();rPane();});
};

/* ---------- the small edits on the header chips ---------- */
function current(){return (TAB==='mat')?mat(SEL.mat):(TAB==='mfr')?mfr(SEL.mfr):insp(SEL.insp);}
window.editText=function(ev,k,label,hint){
  var rec=current();if(!rec)return;
  popText(ev.currentTarget,label,rec[k],hint||'',function(v){
    rec[k]=v;touch();rPane();rList();});
};
var CAT_OPTS=[{v:'C0',l:'C0'},{v:'C1',l:'C1'},{v:'C2',l:'C2'},{v:'C3',l:'C3'},{v:'',l:'clear'}];
window.editCat=function(ev){

    f?('Attachment 1 lists <b>'+esc(f.c.n)+'</b> as '+esc(topCat(f.c.c))+'.')
     :'No entry in Attachment 1 matches this name. Clause 2.2.8 leaves the choice with SEVEN.',
    function(v){m.cat=v;m.catFrom=v?'set by you':'';m.catSure=true;touch();rPane();rList();});
};
window.editKind=function(ev){
  var v=mfr(SEL.mfr);if(!v)return;
  popPick(ev.currentTarget,'What kind of company is this?',KIND_OPTS,kindOf(v),
    KINDS[kindOf(v)].d+' Changing this changes the steps it has to clear.',
    function(k){
      v.kind=k;
      /* anything already recorded stays put — a step that no longer
         applies is simply not shown, and returns if you switch back */
      touch();rPane();rList();
      toast(KINDS[k].l+' \u2014 '+KINDS[k].steps.length+' steps');
    });
};
window.editMfrCat=function(ev){
  var v=mfr(SEL.mfr);if(!v)return;
  popPick(ev.currentTarget,'Highest category supplied',CAT_OPTS,v.cat||'',
    'This decides whether a physical assessment is required — a survey is due for C1, C2 and C3.',
    function(x){
      var was=needsQual(v);
      v.cat=x;
      touch();rPane();rList();
      var now=needsQual(v);
      if(was!==now)toast(now?(KINDS[kindOf(v)].steps.length+' qualification steps now apply')
                            :'C0 — no qualification needed');
    });
};
window.editQty=function(ev){
  var m=mat(SEL.mat);if(!m)return;
  pop(ev.currentTarget,'Quantity on the purchase order',
     '<div style="display:flex;gap:8px"><input id="pop-q" value="'+attr(m.qty||'')+'" placeholder="how many" style="flex:2">'
    +'<input id="pop-u" value="'+attr(m.unit||'')+'" placeholder="unit" style="flex:1"></div>'
    +'<div class="pop-hint">Consignments are counted against this, and the closing dossier falls due a week after the last one is accepted.</div>'
    +'<div class="pop-f"><button class="btn btn-p btn-s" onclick="saveQty()">Save</button>'
    +'<button class="btn-q" onclick="closePop()">Cancel</button></div>');
  window.saveQty=function(){
    m.qty=document.getElementById('pop-q').value.trim();
    m.unit=document.getElementById('pop-u').value.trim();
    closePop();touch();rPane();rList();};
  ['pop-q','pop-u'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();saveQty();}
      if(e.key==='Escape'){e.preventDefault();closePop();}});});
};
window.fixName=function(){
  var p=insp(SEL.insp);if(!p)return;
  var n=(document.getElementById('fix-name')||{value:''}).value.trim();
  if(!n)return toast('Enter a name');
  p.name=n;touch();rList();rPane();
};
window.cycleInsp=function(ev){
  var p=insp(SEL.insp);if(!p)return;
  popPick(ev.currentTarget,'Approval',['Pending','Approved','Suspended'],p.status||'Pending',
    'Clause 2.2.17 has SEVEN review and approve every inspector before an assignment.',
    function(v){p.status=v;touch();rPane();rList();});
};
window.pickMfr=function(){
  var m=mat(SEL.mat);if(!m)return;
  /* you do not buy a material from an inspection agency, so it is not
     offered here — it appears where inspections are assigned instead */
  var list=(DB.mfrs||[]).filter(function(v){return kindOf(v)!=='agency';}).sort(function(a,b){
    var A=mfrState(a).ok?0:1, B=mfrState(b).ok?0:1;
    return A-B||String(a.name).localeCompare(String(b.name));});
  sheet('Vendor',
     '<div class="dim" style="font-size:13.5px;margin-bottom:16px">Qualification is recorded once on the vendor and read by every material it supplies. '
      +'Naming one that is not yet qualified is allowed — the material simply will not clear that step.</div>'
    +(list.length?list.map(function(v){
        var ms=mfrState(v), cur=(String(m.mfr)===String(v.id));
        return '<div class="row row-a" onclick="setMfr('+v.id+')">'
          +'<span class="tag t-'+ms.tone+'" style="min-width:96px;text-align:center;flex-shrink:0">'+esc(ms.word)+'</span>'
          +'<div style="flex:1;min-width:0"><div>'+esc(v.name)
            +' <span class="dim">· '+esc(KINDS[kindOf(v)].l.toLowerCase())+'</span>'
            +(v.cat?' <span class="dim">· '+esc(v.cat)+'</span>':'')+'</div>'
          +'<div class="dim" style="font-size:12.5px;margin-top:2px">'
            +(ms.ok?((needsQual(v)?'qualified':'C0 \u2014 no qualification needed')+(v.country?' · '+esc(v.country):''))
                   :esc(ms.short.slice(0,2).join(' · ')+(ms.short.length>2?(' · +'+(ms.short.length-2)+' more'):'')))
          +'</div></div>'
          +(cur?'<span class="tag t-wait">current</span>':'')+'</div>';
      }).join(''):'<div class="dim">No vendors of this sort yet.</div>')
    +'<div class="f-act" style="margin-top:20px"><button class="btn btn-p" onclick="newMfrFor()">Add a new vendor</button>'
    +(m.mfr?'<button class="btn-q" onclick="setMfr(\'\')">Remove the link</button>':'')+'</div>');
};
window.setMfr=function(id){
  var m=mat(SEL.mat);if(!m)return;
  m.mfr=id?String(id):'';
  touch();closeSheet();rPane();rList();
  if(!id)return;
  var ms=mfrState(mfr(id));
  if(!ms.ok)toast(ms.v.name+' — '+ms.short[0].toLowerCase());
};
window.newMfrFor=function(){

    '<div class="panel" style="margin-top:16px"><div class="panel-b">'

  var i=document.getElementById('nm-name');i.focus();
  i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();createMfrFor();}});
};
window.createMfrFor=function(){

  if(!n)return toast('Give it a name');

  DB.mfrs.push(v);m.mfr=String(v.id);

  toast('Added — its qualification is recorded on the vendor');
};
</script>

<script>
/* ================================================================
   7. WHAT IS DUE, THE LOOK-AHEAD, THE FILE
   ================================================================ */
/* Late matters more the longer it has been late, but a certificate
   that lapsed two years ago must not bury today's deadline — so the
   scale is capped. A permission that has simply not arrived scores
   below anything you can actually miss. */
function score(n,soft){
  if(soft)return Math.max(10,30-n);
  return n<0?Math.min(99,80+Math.min(Math.abs(n),19)):Math.max(20,62-n);
}
function findings(){
  var out=[];
  function add(p,tone,word,title,line,id,tab){out.push({p:p,tone:tone,word:word,t:title,s:line,id:id,tab:tab});}

  (DB.mfrs||[]).forEach(function(v){
    if(!needsQual(v))return;
    mfrRoad(v).forEach(function(x){
      var d=x.data, st=x.s;
      if(st.k==='iso'&&d.date){
        var n=daysTo(d.date);
        if(n<0)add(score(n),'bad','expired',v.name,'ISO 9001 expired '+show(d.date)+', '+when(d.date),v.id,'mfr');
        else if(n<=60)add(70-n/2,'now','in '+n+'d',v.name,'ISO 9001 expires '+show(d.date),v.id,'mfr');
      }
      if(x.state==='bad'&&st.k!=='iso')add(90,'bad','blocked',v.name,st.n+' came back '+String(d.status||'').toLowerCase(),v.id,'mfr');
      if(x.now&&x.state==='open')add(45,'now','your move',v.name,'waiting on you — '+st.n,v.id,'mfr');
      var due=st.due?st.due(v,d):null;
      if(due&&st.k!=='iso'&&!(due.soft&&daysTo(due.on)<=0)){
        var n2=daysTo(due.on);
        if(n2<=21)add(score(n2,due.soft),(!due.soft&&n2<0)?'bad':'now',
          (!due.soft&&n2<0)?(Math.abs(n2)+'d late'):('in '+Math.max(n2,0)+'d'),
          v.name,st.n+' — '+due.t+' '+show(due.on),v.id,'mfr');}
    });
  });
  (DB.mats||[]).forEach(function(m){
    if(!m.cat)add(50,'now','set it',m.name,'no category, so its road is unknown',m.id,'mat');
    if(m.cat&&m.cat!=='C0'&&!m.mfr)add(52,'now','name it',m.name,'no vendor named, and one is required above category 0',m.id,'mat');
    /* the material inherits whatever its vendor is short of */
    if(m.cat&&m.cat!=='C0'&&m.mfr&&needsQual(mfrOf(m))){
      var ms=mfrState(mfrOf(m));
      if(!ms.ok)add(ms.tone==='bad'?78:44,ms.tone==='bad'?'bad':'wait',
        ms.tone==='bad'?'blocked':'waiting',m.name,
        ms.v.name+' ('+KINDS[kindOf(ms.v)].l.toLowerCase()+') — '+ms.short[0].toLowerCase()
        +(ms.short.length>1?(' and '+(ms.short.length-1)+' more'):''),m.id,'mat');
    }
    openNCR(m)&&add(72,'bad',openNCR(m)+' open',m.name,'non-conformances still open — the closing dossier cannot be settled',m.id,'mat');
    matRoad(m).steps.forEach(function(x){
      var d=x.data, st=x.s;
      if(x.state==='bad'&&!st.linked)add(88,'bad','blocked',m.name,st.n+' came back '+String(d.status||'rejected').toLowerCase(),m.id,'mat');
      else if(x.now&&x.state==='open')add(42,'now','your move',m.name,'waiting on you — '+st.n,m.id,'mat');
      else if(x.now&&x.state==='wait')add(24,'wait','waiting',m.name,'with the reviewer — '+st.n,m.id,'mat');
      var due=st.due?st.due(m,d):null;
      if(due&&!(due.soft&&daysTo(due.on)<=0)){
        var n=daysTo(due.on);
        if(n<=21)add(score(n,due.soft),(!due.soft&&n<0)?'bad':'now',
          (!due.soft&&n<0)?(Math.abs(n)+'d late'):('in '+Math.max(n,0)+'d'),
          m.name,st.n+' — '+due.t+' '+show(due.on),m.id,'mat');}
    });
  });
  (DB.people||[]).forEach(function(p){
    if((p.status||'Pending')==='Approved')return;
    var n=assignments(p).length;
    if(n)add(p.status==='Suspended'?86:64,p.status==='Suspended'?'bad':'now',
      String(p.status||'pending').toLowerCase(),p.name||'Unnamed inspector',
      'named on '+n+' inspection'+(n===1?'':'s')+' but not approved by SEVEN — clause 2.2.17',p.id,'insp');
    else if(!p.name)add(30,'now','no name','Unnamed inspector','an inspector record with no name — give it one or delete it',p.id,'insp');
  });
  return out.sort(function(a,b){return b.p-a.p;});
}
window.showDue=function(){
  var f=findings();
  sheet('What is due',f.length
    ? f.map(function(o){
        return '<div class="row row-a" onclick="jump(\''+o.tab+'\','+o.id+')">'
          +'<span class="tag t-'+o.tone+'" style="min-width:82px;text-align:center;flex-shrink:0">'+esc(o.word)+'</span>'
          +'<div style="flex:1;min-width:0"><div>'+esc(o.t)+'</div>'
          +'<div class="dim" style="font-size:13px;margin-top:2px">'+esc(o.s)+'</div></div></div>';
      }).join('')
    : '<div class="dim" style="padding:30px 0;text-align:center">Nothing is late and nothing is waiting on you.</div>');
};
window.jump=function(tab,id){
  closeSheet();
  if(!id)return setTab(tab);
  TAB=tab;SEL[tab]=id;
  ['home','cal','mat','mfr','insp'].forEach(function(k){
    var b=document.getElementById('tab-'+k);if(b)b.setAttribute('aria-selected',tab===k);});
  document.getElementById('side-body').classList.remove('hidden');
  document.getElementById('add-btn').textContent='Add '+NOUN[tab];
  document.getElementById('q').value='';
  rList();rPane();};

/* the weekly submission SEVEN asks for, clause 2.2.6 */
window.lookAhead=function(){
  var t0=today(), end=addDays(t0,14), rows=[];
  function add(date,what,who){if(date&&date>=t0&&date<=end)rows.push({d:date,w:what,who:who});}
  (DB.mfrs||[]).forEach(function(v){
    var s=v.steps||{};
    if(s.pa&&s.pa.date&&s.pa.status==='Scheduled')add(s.pa.date,'Factory survey — '+v.name,s.pa.by||'');
    if(s.iso&&s.iso.date)add(s.iso.date,'ISO 9001 expires — '+v.name,'');
  });
  (DB.mats||[]).forEach(function(m){
    var s=m.steps||{};
    if(s.pfm&&s.pfm.date&&s.pfm.status!=='Approved')add(s.pfm.date,'Pre-fabrication meeting — '+m.name,'');
    if(s.fat&&s.fat.date&&['Pending','Scheduled'].indexOf(s.fat.status)>=0)add(s.fat.date,'Final inspection or FAT — '+m.name,s.fat.by||'');
    if(s.ipi&&s.ipi.date)add(s.ipi.date,'In-process inspection — '+m.name,s.ipi.by||'');
    matRoad(m).steps.forEach(function(x){
      var due=x.s.due?x.s.due(m,x.data):null;
      if(due)add(due.on,x.s.n+' — '+due.t+' — '+m.name,'');
    });
    (m.dels||[]).forEach(function(d){if(d.status==='Pending')add(d.date,'Delivery to inspect — '+m.name,'');});
  });
  (DB.events||[]).forEach(function(e){
    if(!e.date)return;
    occurs(e,t0,end).forEach(function(d){add(d,e.title,EV_KIND[e.type||'other'].l.toLowerCase());});
  });
  rows.sort(function(a,b){return a.d.localeCompare(b.d);});
  var days=[];
  for(var i=0;i<14;i++){var d=addDays(t0,i);days.push({d:d,items:rows.filter(function(r){return r.d===d;})});}
  sheet('Two-week look-ahead',
     '<div class="dim" style="font-size:13.5px;margin-bottom:16px">'+esc(DB.project||'')+' · '
      +new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
      +' · submitted weekly under clause 2.2.6.</div>'
    +days.map(function(x){
        var dt=new Date(x.d);
        return '<div class="row" style="align-items:flex-start">'
          +'<div style="width:104px;flex-shrink:0"><div class="meta">'+show(x.d)+'</div>'
          +'<div class="dim" style="font-size:12px">'+dt.toLocaleDateString('en-GB',{weekday:'long'})+'</div></div>'
          +'<div style="flex:1">'+(x.items.length
            ? x.items.map(function(r){return '<div style="padding:2px 0">'+esc(r.w)+(r.who?' <span class="dim">· '+esc(r.who)+'</span>':'')+'</div>';}).join('')
            : '<span class="dim">—</span>')+'</div></div>';
      }).join('')
    +'<div class="f-act" style="margin-top:18px"><button class="btn" onclick="window.print()">Print</button></div>');
};
/* a single sheet with everything on one material, for a meeting or a file */
window.printRecord=function(){
  var m=mat(SEL.mat);if(!m)return;
  var v=mfrOf(m), r=matRoad(m);
  var rows=r.steps.map(function(x,i){
    var d=x.data, st=x.s;
    var val=st.linked?(v?(!needsQual(v)?'Not required for C0':(mfrRoad(v).every(function(y){return y.state==='done';})?'Qualified':'In qualification')):'No vendor')
      :st.deliveries?((m.dels||[]).length+' consignment'+((m.dels||[]).length===1?'':'s')+', '+received(m)+' accepted')
      :[d.status||'—',d.ref||'',d.date?show(d.date):'',d.by||''].filter(Boolean).join('  ·  ');
    return '<div class="row"><div style="width:26px" class="meta">'+(i+1)+'</div>'
      +'<div style="flex:1"><div>'+esc(st.n)+' <span class="sclause">'+esc(st.clause)+'</span></div>'
      +'<div class="dim" style="font-size:13px;margin-top:2px">'+esc(val)+'</div></div>'
      +'<span class="tag t-'+(x.state==='done'?'ok':x.state==='bad'?'bad':x.state==='wait'?'wait':'na')+'">'
      +(x.state==='done'?'done':x.state==='bad'?'returned':x.state==='wait'?'with reviewer':'not started')+'</span></div>';
  }).join('');
  var ncr=(m.ncrs||[]);
  sheet('Record — '+m.name,
     '<div class="dim" style="font-size:13.5px;margin-bottom:14px">'+esc(DB.project||'')+' · '
      +new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div>'
    +'<div class="row"><div style="width:150px" class="dim">Category</div><div>'+esc(m.cat||'—')
      +(m.catFrom?' <span class="dim">· '+esc(m.catFrom)+'</span>':'')+'</div></div>'
    +'<div class="row"><div style="width:150px" class="dim">Vendor</div><div>'+esc(v?v.name:'—')
      +(v?' <span class="dim">· '+esc(KINDS[kindOf(v)].l.toLowerCase())+'</span>':'')
      +(v&&v.site?' <span class="dim">· '+esc(v.site)+'</span>':'')+'</div></div>'
    +'<div class="row"><div style="width:150px" class="dim">Reference</div><div class="mono">'+esc(m.ref||'—')+'</div></div>'
    +'<div class="row"><div style="width:150px" class="dim">Quantity</div><div>'
      +(m.qty?(received(m)+' of '+m.qty+' '+esc(m.unit||'')+' accepted'):'—')+'</div></div>'
    +'<div class="sec">Steps</div>'+rows
    +(ncr.length?('<div class="sec">Non-conformances</div>'+ncr.map(function(n){
        return '<div class="row"><span class="tag t-'+(n.status==='Closed'?'ok':'bad')+'">'+esc(n.status||'Open')+'</span>'
          +'<div style="flex:1"><div>'+(n.no?'<span class="mono">'+esc(n.no)+'</span> ':'')+esc(n.what||'')+'</div>'
          +(n.fix?'<div class="dim" style="font-size:13px;margin-top:2px">'+esc(n.fix)+'</div>':'')+'</div>'
          +'<span class="meta">'+esc(show(n.date))+'</span></div>';}).join('')):'')
    +'<div class="f-act" style="margin-top:18px"><button class="btn" onclick="window.print()">Print</button></div>');
};
function unapproved(){return (DB.people||[]).filter(function(p){return (p.status||'Pending')!=='Approved';}).length;}
/* Clause 2.2.7 asks for this every week, for every C1 to C3 material.
   Nothing here is entered twice — it is the same records read across
   instead of down. */
window.fabStatus=function(){
  var rows=(DB.mats||[]).filter(function(m){
    return ['C1','C2','C3'].indexOf(m.cat)>=0;
  }).sort(function(a,b){return matRoad(a).at-matRoad(b).at;});

  function stage(m){
    var r=matRoad(m);
    if(r.at<0)return {t:'Delivered and closed',k:'ok'};
    var cur=r.steps[r.at];
    if(cur.state==='bad'){
      /* the linked step has no status of its own — its trouble belongs
         to the vendor, so say that rather than a made-up phrase */
      if(cur.s.linked){
        var ms=mfrState(mfrOf(m));
        return {t:'Held — '+(ms.short[0]||'vendor not qualified').toLowerCase(),k:'bad'};
      }
      var st=String((cur.data||{}).status||'').toLowerCase();
      return {t:cur.s.n+(st?(' — '+st):' returned'),k:'bad'};
    }
    var order=['mts','mfr','pid','pfm','itp','ipi','fat','irn','del','post'];
    var word={mts:'Awaiting submittal approval',mfr:'Vendor not yet qualified',
      pid:'Dossier with the reviewer',pfm:'Before the pre-fabrication meeting',
      itp:'Inspection plan not agreed',ipi:'In fabrication',fat:'Awaiting final inspection',
      irn:'Released, awaiting shipment',del:'In transit or being delivered',post:'Closing dossier outstanding'};
    return {t:word[cur.s.k]||cur.s.n,k:cur.state==='wait'?'wait':'now'};
  }
  function late(m){
    var out=[];
    matRoad(m).steps.forEach(function(x){
      var d=x.s.due?x.s.due(m,x.data):null;
      if(d&&!d.soft&&daysTo(d.on)<0)out.push(x.s.n+' '+Math.abs(daysTo(d.on))+'d');
    });
    var v=mfrOf(m), ms=v?mfrState(v):null;
    if(ms&&ms.tone==='bad')out.push(ms.short[0]);
    return out;
  }

  sheet('Quality fabrication status',
     '<div class="dim" style="font-size:13.5px;margin-bottom:16px">'+esc(DB.project||'')+' · week of '
      +new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
      +' · categories 1 to 3, submitted weekly under clause 2.2.7.</div>'
    +(rows.length
      ? rows.map(function(m){
          var st=stage(m), l=late(m), v=mfrOf(m), r=matRoad(m);
          var ord=num(m.qty), got=received(m), n=openNCR(m);
          return '<div class="row row-a" style="align-items:flex-start" onclick="jump(\'mat\','+m.id+')">'
            +'<span class="tag t-'+st.k+'" style="min-width:112px;text-align:center;flex-shrink:0">'+esc(m.cat)+'</span>'
            +'<div style="flex:1;min-width:0">'
              +'<div style="font-weight:500">'+esc(m.name)+'</div>'
              +'<div class="dim" style="font-size:13px;margin-top:3px">'+esc(st.t)
                +(v?(' · '+esc(v.name)):'')+' · step '+(r.at<0?r.steps.length:(r.at+1))+' of '+r.steps.length+'</div>'
              +(ord?('<div class="dim" style="font-size:13px;margin-top:2px">'+got+' of '+ord+' '+esc(m.unit||'')+' delivered</div>'):'')
              +(l.length?('<div style="font-size:13px;margin-top:4px;color:var(--bad-t)">Late: '+esc(l.join(' · '))+'</div>'):'')
              +(n?('<div style="font-size:13px;margin-top:2px;color:var(--now-t)">'+n+' non-conformance'+(n===1?'':'s')+' open</div>'):'')
            +'</div>'
            +'<div class="feed-w"><span class="meta">'+r.done+'/'+r.steps.length+'</span></div></div>';
        }).join('')
      : '<div class="dim" style="padding:26px 0;text-align:center">No category 1 to 3 material is on record yet.</div>')
    +'<div class="f-act" style="margin-top:20px">'
    +'<button class="btn" onclick="window.print()">Print</button>'
    +'<button class="btn" onclick="fabCSV()">Export a spreadsheet</button></div>');
};
window.fabCSV=function(){
  var head=['Material','Category','Vendor','Vendor qualified','Stage','Step','Ordered','Delivered','Late','Open NCRs'].join(',');
  var lines=(DB.mats||[]).filter(function(m){return ['C1','C2','C3'].indexOf(m.cat)>=0;}).map(function(m){
    var r=matRoad(m), v=mfrOf(m), ms=v?mfrState(v):null, cur=r.at>=0?r.steps[r.at]:null;
    var l=[];
    r.steps.forEach(function(x){
      var d=x.s.due?x.s.due(m,x.data):null;
      if(d&&!d.soft&&daysTo(d.on)<0)l.push(x.s.n+' '+Math.abs(daysTo(d.on))+'d');
    });
    return [m.name,m.cat,v?v.name:'',ms?(!needsQual(v)?'Not required':(ms.ok?'Yes':'No')):'',
      cur?cur.s.n:'All steps cleared',(r.at<0?r.steps.length:(r.at+1))+' of '+r.steps.length,
      m.qty?(m.qty+' '+(m.unit||'')):'',received(m),l.join(' | '),openNCR(m)]
      .map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');
  });
  var blob=new Blob(['\ufeff'+[head].concat(lines).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=(DB.project||'fabrication')+'-status.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},800);
  toast('Exported');
};
window.showMenu=function(){
  var mats=(DB.mats||[]).length, mfrs=(DB.mfrs||[]).length;
  var ncr=(DB.mats||[]).reduce(function(a,m){return a+openNCR(m);},0);
  sheet('More',
     '<div class="row"><div style="width:170px" class="dim">Project</div><div style="flex:1">'+esc(DB.project||'—')
      +' <button class="btn-q" data-pop onclick="rename(event)">rename</button></div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Signed in as</div><div style="flex:1">'
      +esc((USER&&USER.email)||'—')+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Materials</div><div>'+mats+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Vendors</div><div>'+mfrs+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Open non-conformances</div><div>'+ncr+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Inspectors</div><div>'+(DB.people||[]).length
      +(unapproved()?(' <span class="tag t-now" style="margin-left:8px">'+unapproved()+' not approved</span>'):'')+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Saved</div><div>'
      +(SAVED?('to the database at '+SAVED.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})):'—')+'</div></div>'
    +'<div class="row"><div style="width:170px" class="dim">Categories</div><div>'+CATS.length+' components from Attachment 1</div></div>'
    +'<div class="f-act" style="margin-top:20px">'
    +'<button class="btn btn-p" onclick="lookAhead()">Two-week look-ahead</button>'
    +'<button class="btn btn-p" onclick="fabStatus()">Fabrication status</button>'
    +'<button class="btn" onclick="refresh()">Refresh</button>'
    +'<button class="btn" onclick="exportCSV()">Export a spreadsheet</button>'
    +'<button class="btn" onclick="backup()">Download a backup</button>'
    +'<span style="flex:1"></span>'
    +'<button class="btn btn-d btn-s" onclick="signOut()">Sign out</button></div>');
};
/* the free plan keeps no backups of its own, so this stays */
window.backup=function(){
  var b=new Blob([JSON.stringify({_v:4,project:DB.project,mfrs:DB.mfrs,mats:DB.mats,
    people:DB.people,events:DB.events,saved:new Date().toISOString()},null,1)],{type:'application/json'});
  var u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=(DB.project||'materials').replace(/[^\w -]/g,'').trim()+'-'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},800);
  toast('Backup downloaded');
