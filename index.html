<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================================================================
   MATERIAL TRACKER — light
   Two lists, one detail pane. Everything is typed where it is read.
   Colour carries state and never decoration; every state also
   carries a word, so it survives being printed or misread.
   ================================================================ */
:root{
  /* surfaces */
  --bg:#f5f6f8; --card:#ffffff; --sunk:#eef0f3; --hover:#f7f8fa;
  --line:#e2e5ea; --line-2:#cdd3db; --line-3:#aab2bd;
  /* text — all at or above 4.5:1 on white */
  --ink:#12161c; --ink-2:#59616d; --ink-3:#6e7783; --ink-4:#89919d;
  /* state: line, text, wash */
  --ok:#2e7d51;   --ok-t:#1f6440;  --ok-b:#e8f5ee;
  --now:#9a6512;  --now-t:#845410; --now-b:#fdf3e2;
  --wait:#2c6ba8; --wait-t:#245a8d; --wait-b:#e9f2fa;
  --bad:#b03636;  --bad-t:#962c2c; --bad-b:#fdeeee;
  --accent:#1f2937;
  /* the rail is dark, so it carries its own set — the working area
     stays light and the two never borrow each other's values */
  --rail:#161a20; --rail-2:#1d222a; --rail-3:#262c35;
  --rail-line:#2b323c; --rail-line-2:#3a4351;
  --rail-t:#f1f3f6; --rail-t2:#a8b1bd; --rail-t3:#7d8794;
  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:8px; --r-lg:12px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-md:0 4px 14px rgba(16,24,40,.09);
  --sh-lg:0 18px 44px rgba(16,24,40,.16);
  --fast:180ms cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--wait);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------------- left rail ---------------- */
.side{width:344px;flex-shrink:0;background:var(--rail);border-right:1px solid var(--rail-line);
  display:flex;flex-direction:column;min-height:0;color:var(--rail-t)}
.side-h{padding:20px 20px 0;flex-shrink:0}
.side ::selection{background:rgba(255,255,255,.16)}
.brand{display:flex;align-items:center;gap:10px;width:100%;padding:8px;margin:-8px -8px 0;
  background:none;border:1px solid transparent;border-radius:var(--r);cursor:pointer;text-align:left;
  transition:background var(--fast),border-color var(--fast)}
.brand:hover{background:var(--rail-2)}
.brand[aria-selected=true]{background:var(--rail-3);border-color:var(--rail-line-2)}
.brand[aria-selected=true] .logo{background:var(--rail-t);color:var(--rail);border-color:var(--rail-t)}
.brand-go{margin-left:auto;font-size:12px;color:var(--rail-t3);flex-shrink:0}
.brand[aria-selected=true] .brand-go{color:var(--rail-t)}
.brand-m{min-width:0}
.brand-t{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-s{font-size:12px;color:var(--rail-t3);margin-top:2px}
.brand-s.dirty{color:var(--now-t)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--rail-3);color:var(--rail-t);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--rail-line-2)}
.logo svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* the two lists */
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:16px 12px 0;flex-shrink:0}
.tab{flex:1 1 auto;padding:9px 12px;border:none;background:none;border-radius:var(--r);cursor:pointer;
  font-size:13.5px;font-weight:450;color:var(--rail-t3);transition:background var(--fast),color var(--fast);
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;white-space:nowrap}
.tab:hover{background:var(--rail-2);color:var(--rail-t)}
.tab[aria-selected=true]{background:var(--rail-3);color:var(--rail-t);font-weight:500}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--rail-t3)}

.side-s{padding:12px 16px;flex-shrink:0}
.search-row{display:flex;gap:8px}
.search-row .search{flex:1;min-width:0}
.add-btn{flex-shrink:0;width:42px;height:42px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--rail-line-2);background:var(--rail-2);color:var(--rail-t);
  display:flex;align-items:center;justify-content:center;transition:background var(--fast),border-color var(--fast)}
.add-btn:hover{background:var(--rail-3);border-color:var(--rail-t3)}
.add-btn.ready{background:var(--rail-t);border-color:var(--rail-t);color:var(--rail)}
.add-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.wider{width:100%;margin-top:8px;padding:8px 11px;border-radius:var(--r);cursor:pointer;text-align:left;
  border:1px solid var(--rail-line);background:var(--rail-2);color:var(--rail-t2);font-size:12.5px;
  transition:background var(--fast),color var(--fast)}
.wider:hover{background:var(--rail-3);color:var(--rail-t)}
.wider b{color:var(--rail-t);font-weight:500}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--rail-t3);fill:none;stroke-width:1.8;pointer-events:none}
.q{width:100%;background:var(--rail-2);border:1px solid var(--rail-line);border-radius:var(--r);
  padding:10px 12px 10px 36px;color:var(--rail-t);font-family:var(--sans);font-size:14px;outline:none;
  transition:border-color var(--fast),background var(--fast);min-height:42px}
.q:focus{border-color:var(--rail-line-2);background:var(--rail-3)}
.q::placeholder{color:var(--rail-t3)}
.q.flash{border-color:var(--now);box-shadow:0 0 0 3px rgba(192,139,46,.28);background:var(--rail-3)}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.q.flash{animation:nudge 320ms ease}

/* the group holding the search box, the list and the footer takes part
   in the rail's own column rather than forming a box of its own —
   otherwise the list stops being a flex child and loses its scroll */
#side-body{display:contents}
#side-body.hidden{display:none}
.filters{display:flex;gap:5px;padding:0 16px 10px;flex-wrap:wrap;flex-shrink:0}
.filters:empty{display:none}
.fchip{border:1px solid var(--rail-line);background:var(--rail-2);color:var(--rail-t3);border-radius:20px;
  padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap;min-height:30px;
  transition:background var(--fast),color var(--fast),border-color var(--fast)}
.fchip:hover{background:var(--rail-3);color:var(--rail-t)}
.fchip[aria-pressed=true]{background:var(--rail-t);border-color:var(--rail-t);color:var(--rail);font-weight:500}
.fchip .fn{opacity:.62;margin-left:5px;font-family:var(--mono);font-size:11px}
.side-l{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 12px}
.side-f{padding:12px 16px;border-top:1px solid var(--rail-line);display:flex;gap:8px;align-items:center;flex-shrink:0}

.card{width:100%;text-align:left;padding:11px 13px;border-radius:var(--r);cursor:pointer;margin-bottom:3px;
  border:1px solid transparent;background:none;transition:background var(--fast),border-color var(--fast);display:block}
.card:hover{background:var(--rail-2)}
.card[aria-current=true]{background:var(--rail-3);border-color:var(--rail-line-2)}
.card-t{font-size:14px;font-weight:500;line-height:1.35;color:var(--rail-t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-s{font-size:12.5px;color:var(--rail-t2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-b{display:flex;gap:3px;margin-top:8px}
.card-b i{flex:1;height:4px;border-radius:2px;background:var(--rail-3)}
.card-none{padding:40px 18px;text-align:center;color:var(--rail-t3);font-size:13.5px;line-height:1.75}

/* ---------------- detail ---------------- */
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.head{padding:24px 40px 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.head-t{font-size:24px;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.head-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 40px 80px;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto}
.swhy{max-width:74ch}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;
  border:1px solid var(--line-2);border-radius:20px;color:var(--ink-2);background:var(--card);
  cursor:pointer;transition:border-color var(--fast),background var(--fast);min-height:32px}
.chip:hover{border-color:var(--line-3);background:var(--hover)}
.chip.set{border-color:var(--wait);color:var(--wait-t);background:var(--wait-b)}
.chip.warn{border-color:var(--now);color:var(--now-t);background:var(--now-b)}
.chip.flat{cursor:default;background:var(--sunk);border-color:transparent;color:var(--ink-3)}
.chip.flat:hover{background:var(--sunk)}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

.tag{display:inline-block;font-size:12px;font-weight:450;padding:3px 10px;border:1px solid;border-radius:6px;white-space:nowrap}
.t-ok{border-color:var(--ok);color:var(--ok-t);background:var(--ok-b)}
.t-now{border-color:var(--now);color:var(--now-t);background:var(--now-b)}
.t-wait{border-color:var(--wait);color:var(--wait-t);background:var(--wait-b)}
.t-bad{border-color:var(--bad);color:var(--bad-t);background:var(--bad-b)}
.t-na{border-color:var(--line-2);color:var(--ink-3);background:var(--sunk)}

/* a step on the road */
.step{display:flex;gap:18px;padding:22px 24px;border-radius:var(--r-lg);background:var(--card);
  border:1px solid var(--line);margin-bottom:10px;box-shadow:var(--sh);transition:box-shadow var(--fast)}
.step.now{border-color:var(--now);box-shadow:0 0 0 3px var(--now-b),var(--sh)}
.step.ahead{background:transparent;box-shadow:none;border-style:dashed;border-color:var(--line)}
.step.ahead .stitle,.step.ahead .swhy{color:var(--ink-4)}
.dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;border:1.5px solid var(--line-2);color:var(--ink-4);background:var(--card)}
.dot.done{border-color:var(--ok);color:#fff;background:var(--ok)}
.dot.now{border-color:var(--now);color:var(--now-t);background:var(--now-b);font-weight:500}
.dot.wait{border-color:var(--wait);color:var(--wait-t);background:var(--wait-b)}
.dot.bad{border-color:var(--bad);color:#fff;background:var(--bad)}
.dot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sbody{flex:1;min-width:0}
.stitle{font-size:16px;font-weight:550;letter-spacing:-.011em;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sclause{font-family:var(--mono);font-size:11px;color:var(--ink-4);font-weight:400;letter-spacing:.02em}
.swhy{font-size:13.5px;color:var(--ink-2);line-height:1.65;margin-top:6px}
.srec{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:13px;color:var(--ink-2)}
.sdue{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font-size:13px;padding:7px 11px;border-radius:var(--r);border:1px solid}
.sdue svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;flex-shrink:0}
.d-soon{border-color:var(--now);color:var(--now-t);background:var(--now-b)}
.d-late{border-color:var(--bad);color:var(--bad-t);background:var(--bad-b)}
.d-ok{border-color:var(--line-2);color:var(--ink-2);background:var(--sunk)}

/* inline form — the only place anything is typed */
.form{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;align-items:end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:span 2}
.f label{font-size:12px;font-weight:450;color:var(--ink-2)}
.f input,.f select{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:9px 11px;color:var(--ink);font-family:var(--sans);font-size:14px;outline:none;width:100%;
  min-height:42px;transition:border-color var(--fast),box-shadow var(--fast)}
.f input:focus,.f select:focus{border-color:var(--wait);box-shadow:0 0 0 3px var(--wait-b)}
.f input.mono{font-family:var(--mono);font-size:13.5px}
.f input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-b)}
.f .err{font-size:12px;color:var(--bad-t)}
.f-act{grid-column:1/-1;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:2px}

.btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r);
  padding:9px 16px;font-size:14px;font-weight:450;cursor:pointer;white-space:nowrap;min-height:42px;
  transition:background var(--fast),border-color var(--fast),box-shadow var(--fast);box-shadow:var(--sh)}
.btn:hover{background:var(--hover);border-color:var(--line-3)}
.btn:active{box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn-p:hover{background:#111827;border-color:#111827}
.btn-s{padding:7px 13px;font-size:13.5px;min-height:36px}
.btn-q{border:none;background:none;box-shadow:none;color:var(--ink-3);padding:8px 10px;min-height:36px;font-size:13.5px}
.btn-q:hover{background:var(--sunk);color:var(--ink)}
.btn-d{color:var(--bad-t);border-color:var(--line-2)}
.btn-d:hover{background:var(--bad-b);border-color:var(--bad)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* a checklist, folded */
.cl{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.cl.open{border-color:var(--line-2)}
.cl-head{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 15px;text-align:left;
  background:var(--sunk);border:none;cursor:pointer;transition:background var(--fast)}
.cl-head:hover{background:#e7eaee}
.cl.open .cl-head{background:var(--card);border-bottom:1px solid var(--line)}
.cl-arrow{width:16px;height:16px;flex-shrink:0;margin-top:2px;stroke:var(--ink-3);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--fast)}
.cl-head[aria-expanded=true] .cl-arrow{transform:rotate(90deg)}
.cl-m{flex:1;min-width:0}
.cl-t{font-size:14px;font-weight:500}
.cl-s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.cl-body{padding:6px 15px 4px}
.cl-item{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);
  font-size:13.5px;cursor:pointer;line-height:1.5}
.cl-item:first-child{border-top:none}
.cl-item input{width:19px;height:19px;accent-color:var(--ok);flex-shrink:0;cursor:pointer;margin-top:1px}
.cl-item .ticked{color:var(--ink-3)}
.cl-foot{display:flex;gap:8px;align-items:center;padding:12px 0 14px;border-top:1px solid var(--line);margin-top:4px}

/* small panels used for quantities, non-conformances, and lists */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.panel-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-t{font-size:15px;font-weight:550;letter-spacing:-.011em}
.panel-b{padding:16px 18px}
.line{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.line:first-child{border-top:none}
.line-m{flex:1;min-width:120px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.dim{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:13px}
.bar{height:7px;background:var(--sunk);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--ok);transition:width var(--fast)}
.sec{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-4);margin:26px 0 10px}
.sec:first-child{margin-top:4px}

.empty{padding:76px 32px;text-align:center;color:var(--ink-3);font-size:14.5px;line-height:1.8;max-width:460px;margin:0 auto}
.empty b{color:var(--ink-2);font-weight:500}
.empty .btn{margin-top:20px}

/* the opening board */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;
  box-shadow:var(--sh);cursor:pointer;transition:border-color var(--fast),box-shadow var(--fast)}
.stat:hover{border-color:var(--line-3);box-shadow:var(--sh-md)}
.stat-v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;color:var(--ink-3);margin-top:7px}
.stat.hot .stat-v{color:var(--bad-t)}
.stat.warm .stat-v{color:var(--now-t)}
.feed{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.feed:first-child{border-top:none}
.feed:hover .feed-t{text-decoration:underline}
.feed-m{flex:1;min-width:0}
.feed-t{font-size:14.5px;font-weight:450}
.feed-s{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.feed-w{flex-shrink:0;min-width:88px;text-align:right}
.rail{display:flex;gap:3px;margin-top:9px}
.rail i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px;min-height:84px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(31,41,55,.08)}
.day-n{font-size:11.5px;color:var(--ink-4);font-family:var(--mono)}
.day-d{font-size:12px;font-weight:500;margin-top:1px}
.day-e{font-size:10.5px;padding:2px 5px;border-radius:4px;margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid}
.e-now{border-color:var(--now);color:var(--now-t);background:var(--now-b)}
.e-bad{border-color:var(--bad);color:var(--bad-t);background:var(--bad-b)}
.e-ok{border-color:var(--ok);color:var(--ok-t);background:var(--ok-b)}

/* Past a certain width a single column leaves the eye travelling too
   far for too little, so the board splits and the panels sit side by
   side. Below it, the one column returns. */
.cols{display:grid;grid-template-columns:1fr;gap:0 22px}
@media(min-width:1180px){
  .cols{grid-template-columns:1.15fr .85fr}
  .cols>section{min-width:0}
  .cols .sec:first-child{margin-top:4px}
}

/* the month */
.cal-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cal-m{font-size:19px;font-weight:600;letter-spacing:-.02em;min-width:190px}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;width:100%}
.cal-dow div{text-align:center;font-size:11.5px;font-weight:500;color:var(--ink-4);padding:4px 0;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%}
.cell{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 6px 8px;
  min-height:104px;min-width:0;width:100%;overflow:hidden;cursor:pointer;
  transition:border-color var(--fast),box-shadow var(--fast);
  display:flex;flex-direction:column;gap:3px;text-align:left}
.cell:hover{border-color:var(--line-3);box-shadow:var(--sh)}
.cell.other{background:transparent;border-style:dashed}
.cell.other .cell-n{color:var(--ink-4)}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(31,41,55,.09)}
.cell.weekend{background:var(--sunk)}
.cell-n{font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.cell.today .cell-n{color:var(--accent)}
.ev{font-size:10.5px;padding:3px 5px;border-radius:4px;border:1px solid;line-height:1.3;
  min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.mid{border-radius:0;border-left-width:0;border-right-width:0}
.ev.start{border-radius:4px 0 0 4px;border-right-width:0}
.ev.end{border-radius:0 4px 4px 0;border-left-width:0}
.ev-ok{border-color:var(--ok);color:var(--ok-t);background:var(--ok-b)}
.ev-now{border-color:var(--now);color:var(--now-t);background:var(--now-b)}
.ev-wait{border-color:var(--wait);color:var(--wait-t);background:var(--wait-b)}
.ev-bad{border-color:var(--bad);color:var(--bad-t);background:var(--bad-b)}
.ev-na{border-color:var(--line-2);color:var(--ink-2);background:var(--sunk)}
.cell-more{font-size:10px;color:var(--ink-4);padding-left:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid}

/* opening screen, sheets, toast */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:900}
.gate-c{width:100%;max-width:400px}
.gate-c h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-top:18px}
.gate-c p{font-size:14.5px;color:var(--ink-2);line-height:1.75;margin:10px 0 26px}
.gate-c .btn{width:100%;margin-bottom:10px;min-height:46px}
.msg{font-size:13.5px;line-height:1.7;margin-top:16px;color:var(--bad-t)}
.msg.ok{color:var(--ok-t)}
.gate-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.busy{position:fixed;inset:0;background:rgba(245,246,248,.88);z-index:990;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:14px;color:var(--ink-2)}
.busy.on{display:flex}
.spin{width:26px;height:26px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 720ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ov{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:flex-start;justify-content:center;
  z-index:800;padding:44px 20px;overflow-y:auto}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:14px;width:100%;max-width:680px;margin:auto;overflow:hidden;box-shadow:var(--sh-lg)}
.sheet-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h2{font-size:17px;font-weight:600;letter-spacing:-.015em}
.sheet-b{padding:18px 22px 22px;max-height:66vh;overflow-y:auto}
.row{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.row:first-child{border-top:none}
.row-a{cursor:pointer;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:var(--r)}
.row-a:hover{background:var(--hover)}
/* a small panel that opens against the control that called it, so a
   short edit never leaves the page it belongs to */
.pop{position:fixed;z-index:860;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:14px;min-width:260px;max-width:340px;display:none}
.pop.on{display:block}
.pop-t{font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:10px}
.pop-r{display:flex;gap:7px;flex-wrap:wrap}
.opt{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:9px 14px;
  font-size:14px;cursor:pointer;min-height:40px;transition:background var(--fast),border-color var(--fast)}
.opt:hover{background:var(--hover);border-color:var(--line-3)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pop input{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:9px 11px;font-family:var(--sans);font-size:14px;outline:none;min-height:42px;color:var(--ink)}
.pop input:focus{border-color:var(--wait);box-shadow:0 0 0 3px var(--wait-b)}
.pop-f{display:flex;gap:8px;margin-top:12px;align-items:center}
.pop-hint{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.55}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  border-radius:22px;padding:11px 20px;font-size:13.5px;z-index:950;display:none;box-shadow:var(--sh-lg)}
.toast.on{display:block}

/* buttons inside the rail */
.side .btn{background:var(--rail-2);border-color:var(--rail-line-2);color:var(--rail-t);box-shadow:none}
.side .btn:hover{background:var(--rail-3);border-color:var(--rail-t3)}
.side .btn-p{background:var(--rail-t);border-color:var(--rail-t);color:var(--rail)}
.side .btn-p:hover{background:#fff;border-color:#fff}
.side .btn-q{background:none;border:none;color:var(--rail-t3)}
.side .btn-q:hover{background:var(--rail-2);color:var(--rail-t)}
.side .side-l::-webkit-scrollbar-thumb{background:var(--rail-3);border-color:var(--rail)}
.side .side-l::-webkit-scrollbar-thumb:hover{background:var(--rail-line-2)}
.side :focus-visible{outline-color:#8bb6de}
.brand-s.dirty{color:#e0ab55}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

@media(max-width:880px){
  body{overflow:auto;height:auto}
  .app{flex-direction:column;height:auto}
  .app{overflow:visible;height:auto}
  .side{width:100%;border-right:none;border-bottom:1px solid var(--rail-line)}
  .side-l{max-height:320px}
  .main,.body{overflow:visible;height:auto}
  .head{padding:18px 18px 14px}
  .body{padding:16px 18px 60px}
  .cols{grid-template-columns:1fr}
  .cell{min-height:74px;padding:5px 4px 6px}
  .ev{font-size:9.5px;padding:2px 4px}
  .cal-m{font-size:16px;min-width:0;flex:1}
  .cal-top{gap:6px}
  .form{grid-template-columns:1fr 1fr}
  .f.wide{grid-column:1/-1}
}
@media(max-width:560px){
  .cal-dow{display:none}
  .cal-grid{grid-template-columns:1fr;gap:4px}
  .cell{min-height:0;flex-direction:row;align-items:center;gap:8px;padding:9px 11px}
  .cell.bare,.cell.other{display:none}
  .cal-grid:not(:has(.cell:not(.bare):not(.other)))::after{
    content:"Nothing this month.";display:block;padding:28px;text-align:center;color:var(--ink-3);font-size:14px}
  .cell-n{min-width:26px}
  .ev{flex:1}
}
@media print{
  body{background:#fff;height:auto;overflow:visible}
  .side,.head-m,.no-print,.ov,.toast{display:none!important}
  .main,.body{overflow:visible}
  .step,.panel{box-shadow:none;break-inside:avoid}
}

<script>
if(!(window.supabase&&window.supabase.createClient))window.SB_LIB={state:'failed',tried:['embedded']};
</script>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-c">
    <div class="logo" style="width:44px;height:44px;border-radius:12px">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
    </div>
    <h1>Material tracker</h1>
    <p id="gate-sub">Your vendors, your materials, and the steps the procedure asks of each — in order, one at a time.</p>

    <div class="f" style="text-align:left;margin-bottom:12px">
      <label for="g-email">Email</label>
      <input id="g-email" type="email" autocomplete="username" onkeydown="gateKey(event)">
    </div>
    <div class="f" style="text-align:left;margin-bottom:18px">
      <label for="g-pass">Password</label>
      <input id="g-pass" type="password" autocomplete="current-password" onkeydown="gateKey(event)">
    </div>

    <button class="btn btn-p" id="g-in" onclick="signIn()">Sign in</button>
    <button class="btn" id="g-up" onclick="signUp()">Create an account</button>
    <div class="msg" id="gate-msg" role="status"></div>

    <div class="gate-foot">
      <span class="btn-q" style="cursor:pointer;padding:0" onclick="document.getElementById('imp').click()">Bring in a file from the old version</span>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importPicked(event)">
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none">

  <aside class="side">
    <div class="side-h">
      <button class="brand" id="tab-home" role="tab" aria-selected="true" onclick="setTab('home')" title="Today">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
        <div class="brand-m">
          <div class="brand-t" id="proj">—</div>
          <div class="brand-s" id="saved"></div>
        </div>
        <span class="brand-go">Today</span>
      </button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-mat" role="tab" aria-selected="false" onclick="setTab('mat')">Materials <span class="n" id="n-mat">0</span></button>
      <button class="tab" id="tab-mfr" role="tab" aria-selected="false" onclick="setTab('mfr')">Vendors <span class="n" id="n-mfr">0</span></button>
      <button class="tab" id="tab-insp" role="tab" aria-selected="false" onclick="setTab('insp')">Inspectors <span class="n" id="n-insp">0</span></button>
      <button class="tab" id="tab-cal" role="tab" aria-selected="false" onclick="setTab('cal')">Calendar</button>
    </div>

    <div id="side-body">
    <div class="side-s">
      <div class="search-row">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
          <input class="q" id="q" autocomplete="off" oninput="rList()" onkeydown="searchKey(event)">
        </div>
        <button class="add-btn" id="plus" onclick="addNew()" title="Add" aria-label="Add">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <button class="wider" id="wider" onclick="huntNow()" style="display:none"></button>
    </div>

    <div class="filters" id="filters"></div>
    <div class="side-l" id="list"></div>

    <div class="side-f">
      <button class="btn btn-s btn-p" onclick="addNew()" id="add-btn">Add</button>
      <button class="btn btn-s" onclick="showDue()">What is due</button>
      <button class="btn-q" onclick="showMenu()" aria-label="More">More</button>
    </div>
    </div>
  </aside>

  <main class="main" id="pane"></main>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="sheet">
  <div class="sheet-h"><h2 id="sheet-t"></h2><button class="btn-q" onclick="closeSheet()">Close</button></div>
  <div class="sheet-b" id="sheet-b"></div>
</div></div>

<div class="pop" id="pop" role="dialog" aria-modal="false"></div>
<div class="busy" id="busy"><div class="spin"></div><span id="busy-t">Loading</span></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================================================================
   1. THE FILE
   ================================================================ */
var DB=null, DIRTY=false, SAVED=null, TAB='mat', SEL={mat:null,mfr:null,insp:null}, OPEN=null;
var SB=null, USER=null, SNAP=null, SYNCING=false, PENDING=false;
var TABLES={mfrs:'vendors',mats:'materials',people:'people',events:'events'};

function blank(){return {_v:4,project:'',mfrs:[],mats:[],people:[],events:[]};}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function attr(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove('on');},2100);}
function gmsg(m,ok){var e=document.getElementById('gate-msg');e.className='msg'+(ok?' ok':'');e.innerHTML=m||'';}
function busy(on,label){
  var b=document.getElementById('busy');if(!b)return;
  if(label)document.getElementById('busy-t').textContent=label;
  b.classList.toggle('on',!!on);
}

/* ================================================================
   1. THE DATABASE
   Every record is a row of its own. Two people editing two different
   materials never touch the same row, so neither can quietly undo
   the other — which is exactly what a single shared document would
   have allowed.
   ================================================================ */
function sbReady(){return !!(window.supabase&&window.supabase.createClient);}
function client(){
  if(SB)return SB;
  if(!sbReady())return null;
  SB=window.supabase.createClient(window.SB_URL,window.SB_KEY,
    {auth:{persistSession:true,autoRefreshToken:true,detectSessionUrl:false}});
  return SB;
}
function niceError(e){
  var m=String((e&&e.message)||e||'');
  if(/Invalid login/i.test(m))return 'That email and password do not match an account.';
  if(/Email not confirmed/i.test(m))return 'Check your inbox and confirm the address first.';
  if(/already registered|already been registered/i.test(m))return 'That address already has an account — sign in instead.';
  if(/Password should be/i.test(m))return 'The password needs at least six characters.';
  if(/valid email/i.test(m))return 'That does not look like an email address.';
  if(/Failed to fetch|NetworkError|fetch/i.test(m))return 'No connection to the database. Check the network and try again.';
  if(/row-level security|permission denied/i.test(m))return 'The database refused that. Run the setup SQL, then try again.';
  return m||'Something went wrong.';
}
window.gateKey=function(e){if(e.key==='Enter'){e.preventDefault();signIn();}};
/* the library usually lands within a second, so a click that arrives
   first should wait for it rather than be thrown away */
function waitForLib(ms){
  return new Promise(function(res){
    if(sbReady())return res(true);
    if(window.SB_LIB&&window.SB_LIB.state==='failed')return res(false);
    var t0=Date.now();
    (function poll(){
      if(sbReady())return res(true);
      if(window.SB_LIB&&window.SB_LIB.state==='failed')return res(false);
      if(Date.now()-t0>(ms||12000))return res(false);
      setTimeout(poll,150);
    })();
  });
}
function libProblem(){
  var tried=((window.SB_LIB&&window.SB_LIB.tried)||[]).join(', ');
  return 'The database library could not be loaded'+(tried?(' \u2014 tried '+esc(tried)):'')+'.<br>'
    +'A site network or an ad blocker is the usual cause. '
    +'<span style="cursor:pointer;text-decoration:underline" onclick="location.reload()">Reload</span>'
    +' once you are on a network that allows it.';
}
window.libReady=function(state){
  var e=document.getElementById('gate-msg');
  if(state==='failed')return gmsg(libProblem());
  if(e&&/loading|could not be loaded/i.test(e.textContent||''))gmsg('');
};
window.signIn=async function(){
  gmsg('');
  var email=document.getElementById('g-email').value.trim();
  var pass=document.getElementById('g-pass').value;
  if(!email||!pass)return gmsg('Enter both an email and a password.');
  var b=document.getElementById('g-in');b.disabled=true;b.textContent='Signing in\u2026';
  try{
    if(!(await waitForLib())){b.disabled=false;b.textContent='Sign in';return gmsg(libProblem());}
    var c=client();
    var r=await c.auth.signInWithPassword({email:email,password:pass});
    if(r.error)throw r.error;
    USER=r.data.user;
    await loadAll();
  }catch(e){gmsg(niceError(e));}
  b.disabled=false;b.textContent='Sign in';
};
window.signUp=async function(){
  gmsg('');
  var email=document.getElementById('g-email').value.trim();
  var pass=document.getElementById('g-pass').value;
  if(!email||!pass)return gmsg('Enter both an email and a password.');
  var b=document.getElementById('g-up');b.disabled=true;b.textContent='Creating\u2026';
  try{
    if(!(await waitForLib())){b.disabled=false;b.textContent='Create an account';return gmsg(libProblem());}
    var c=client();
    var r=await c.auth.signUp({email:email,password:pass});
    if(r.error)throw r.error;
    if(r.data.session){USER=r.data.user;await loadAll();}
    else gmsg('Account created. Confirm the address from your inbox, then sign in.',true);
  }catch(e){gmsg(niceError(e));}
  b.disabled=false;b.textContent='Create an account';
};
window.signOut=async function(){
  if(DIRTY)await save();
  try{await client().auth.signOut();}catch(e){}
  USER=null;DB=null;SNAP=null;
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('g-pass').value='';
  gmsg('');
};

/* pull the whole workspace; it is small, and one clean read beats
   half a dozen partial ones */
async function loadAll(){
  busy(true,'Loading your records');
  try{
    var c=client(), out=blank();
    for(var key in TABLES){
      var r=await c.from(TABLES[key]).select('id,data');
      if(r.error)throw r.error;
      out[key]=(r.data||[]).map(function(row){
        var o=row.data||{};o.id=Number(row.id);return o;});
    }
    var st=await c.from('settings').select('key,value').eq('key','project').maybeSingle();
    if(st.error&&st.error.code!=='PGRST116')throw st.error;
    out.project=(st.data&&st.data.value&&st.data.value.name)||'';
    DB=out;snapshot();DIRTY=false;SAVED=new Date();
    busy(false);enter();
  }catch(e){
    busy(false);
    gmsg(niceError(e));
  }
}
function snapshot(){
  SNAP={project:DB.project};
  for(var key in TABLES){
    SNAP[key]={};
    (DB[key]||[]).forEach(function(o){SNAP[key][o.id]=JSON.stringify(o);});
  }
}
/* Save what actually changed. Comparing against the last snapshot
   means an untouched record is never rewritten, so somebody else's
   edit to it survives. */
window.save=async function(){
  if(!DB||!USER||SYNCING)return;
  var c=client();if(!c)return;
  SYNCING=true;stamp();
  try{
    for(var key in TABLES){
      var table=TABLES[key], now={}, ups=[];
      (DB[key]||[]).forEach(function(o){
        now[o.id]=JSON.stringify(o);
        if(SNAP[key][o.id]!==now[o.id])ups.push({id:o.id,data:o});
      });
      if(ups.length){
        var r=await c.from(table).upsert(ups,{onConflict:'id'});
        if(r.error)throw r.error;
      }
      var gone=Object.keys(SNAP[key]).filter(function(id){return !(id in now);});
      if(gone.length){
        var d=await c.from(table).delete().in('id',gone.map(Number));
        if(d.error)throw d.error;
      }
    }
    if(SNAP.project!==DB.project){
      var p=await c.from('settings').upsert({key:'project',value:{name:DB.project}},{onConflict:'key'});
      if(p.error)throw p.error;
    }
    snapshot();DIRTY=false;SAVED=new Date();stamp();
  }catch(e){
    toast('Could not save — '+niceError(e));
  }
  SYNCING=false;
  if(PENDING){PENDING=false;save();}
};
var timer=null;
function touch(){
  DIRTY=true;stamp();
  clearTimeout(timer);
  timer=setTimeout(function(){if(SYNCING)PENDING=true;else save();},1200);
}
function stamp(){
  var e=document.getElementById('saved');if(!e)return;
  if(SYNCING||DIRTY){e.className='brand-s dirty';e.textContent='saving…';return;}
  e.className='brand-s';
  e.textContent=SAVED?('saved '+SAVED.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})):'';
}
window.addEventListener('beforeunload',function(e){if(DIRTY){e.preventDefault();e.returnValue='';}});

/* somebody else may have changed something while this tab sat idle */
window.refresh=async function(quiet){
  if(!USER)return;
  if(DIRTY)await save();
  if(!quiet)busy(true,'Checking for changes');
  var keepTab=TAB, keepSel={mat:SEL.mat,mfr:SEL.mfr,insp:SEL.insp};
  try{
    var c=client(), out=blank();
    for(var key in TABLES){
      var r=await c.from(TABLES[key]).select('id,data');
      if(r.error)throw r.error;
      out[key]=(r.data||[]).map(function(row){var o=row.data||{};o.id=Number(row.id);return o;});
    }
    var st=await c.from('settings').select('value').eq('key','project').maybeSingle();
    out.project=(st.data&&st.data.value&&st.data.value.name)||DB.project;
    DB=out;snapshot();DIRTY=false;SAVED=new Date();
    TAB=keepTab;SEL=keepSel;
    busy(false);rList();rPane();stamp();
    if(!quiet)toast('Up to date');
  }catch(e){busy(false);toast('Could not refresh — '+niceError(e));}
};
window.addEventListener('focus',function(){
  if(USER&&!DIRTY&&SAVED&&(Date.now()-SAVED.getTime()>60000))refresh(true);
});

/* bringing across a file from the version that lived on disk */
window.importPicked=function(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var d;
    try{d=JSON.parse(e.target.result);}catch(x){return gmsg('That file could not be read.');}
    if(!d||typeof d!=='object'||!Array.isArray(d.mats))return gmsg('That is not a tracker file.');
    PENDING_IMPORT=d;
    gmsg('Read <b>'+esc(f.name)+'</b> — '+(d.mats||[]).length+' materials, '+(d.mfrs||[]).length
      +' vendors. Sign in and it will be brought across.',true);
  };

var PENDING_IMPORT=null;
async function runImport(){
  if(!PENDING_IMPORT)return;
  var d=PENDING_IMPORT;PENDING_IMPORT=null;
  busy(true,'Bringing your file across');
  try{
    /* ids can collide with what is already there, so anything that
       clashes is given a new one and its links are followed through */
    var used={};
    ['mfrs','mats','people','events'].forEach(function(k){
      (DB[k]||[]).forEach(function(o){used[o.id]=1;});
    });
    var remap={};
    (d.mfrs||[]).forEach(function(v){
      var old=v.id;
      if(used[v.id])v.id=uid();
      used[v.id]=1;remap[old]=v.id;
      DB.mfrs.push(v);
    });
    (d.mats||[]).forEach(function(m){
      if(used[m.id])m.id=uid();
      used[m.id]=1;
      if(m.mfr&&remap[m.mfr]!==undefined)m.mfr=String(remap[m.mfr]);
      DB.mats.push(m);
    });
    (d.people||[]).forEach(function(p){
      if(used[p.id])p.id=uid();used[p.id]=1;DB.people.push(p);});
    (d.events||[]).forEach(function(e2){
      if(used[e2.id])e2.id=uid();used[e2.id]=1;
      if(e2.link&&/^mfr:/.test(e2.link)){
        var oldId=e2.link.slice(4);
        if(remap[oldId]!==undefined)e2.link='mfr:'+remap[oldId];
      }
      DB.events.push(e2);});
    if(!DB.project&&d.project)DB.project=d.project;
    await save();
    busy(false);
    toast('Brought across '+(d.mats||[]).length+' materials and '+(d.mfrs||[]).length+' vendors');
  }catch(e){busy(false);toast('Could not bring the file across — '+niceError(e));}
}

function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function addDays(iso,n){return ymd(new Date(new Date(iso).getTime()+n*864e5));}
function daysTo(iso){return Math.round((new Date(iso)-new Date(today()))/864e5);}
function build(y,mo,d){
  if(!(y>=1900&&y<=2200)||!(mo>=1&&mo<=12)||!(d>=1&&d<=31))return null;
  var t=new Date(Date.UTC(y,mo-1,d));
  if(t.getUTCFullYear()!==y||t.getUTCMonth()!==mo-1||t.getUTCDate()!==d)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function parseDate(t){
  t=String(t||'').trim();var m;
  if(!t)return '';
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return build(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})$/))){
    var y=m[3].length===2?('20'+m[3]):m[3];return build(+y,+m[2],+m[1]);}
  return null;
}
function show(iso){
  if(!iso)return '';
  var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?(m[3]+'/'+m[2]+'/'+m[1]):String(iso);
}
function when(iso){
  var n=daysTo(iso);
  return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n<0?(Math.abs(n)+' days ago'):('in '+n+' days');
}
function key(x){return String(x||'').toLowerCase().replace(/\s+/g,' ').replace(/[.,]/g,'').trim();}
function num(x){var n=parseFloat(x);return isFinite(n)?n:0;}
function uid(){return Date.now()+Math.floor(Math.random()*900);}

var CATS=(window.CATS||[]).map(function(r){return {sr:r[0],n:r[1],t:r[2],c:r[3]};});
/* the procedure names a category for each component; an exact name is
   certain, a partial one is worth confirming before it is relied on */
function lookCat(text){
  var q=key(text);if(q.length<4)return null;
  var exact=null,inside=null,il=0,around=null,al=1e9;
  CATS.forEach(function(c){
    if(!c.c)return;
    var n=key(c.n);if(n.length<4)return;
    if(n===q){exact=exact||c;return;}
    if(q.indexOf(n)>=0){if(n.length>il){inside=c;il=n.length;}return;}
    if(n.indexOf(q)>=0){if(n.length<al){around=c;al=n.length;}}
  });
  if(exact)return {c:exact,sure:true};
  var hit=inside||around;
  return hit?{c:hit,sure:false}:null;
}
function topCat(c){var p=String(c||'').split('|').filter(Boolean);return p.length?p[p.length-1]:'';}

   A vendor is qualified once and serves many materials, so it
   is a record of its own. Everything that belongs to one shipment
   of one material stays on that material — splitting it across

var STATUS=['Pending','Approved','Approved with comments','Resubmit','Rejected'];
function settled(st){return ['Approved','Approved with comments','Passed','Passed with comments','Waived','Sent','Closed','Received'].indexOf(st)>=0;}
function failed(st){return ['Rejected','Resubmit','Failed'].indexOf(st)>=0;}
function mfr(id){return (DB.mfrs||[]).find(function(x){return String(x.id)===String(id);});}
function mat(id){return (DB.mats||[]).find(function(x){return String(x.id)===String(id);});}

/* ---------------------------------------------------------------
   Four kinds of company appear on a project and the procedure asks
   different things of each. A factory is qualified with its site and
   surveyed; a subcontractor is judged on its own quality system; a
   trader is qualified through the maker it represents; an inspection
   agency is approved for the discipline it inspects. Giving them all
   one road would ask a trader for a factory survey and let an agency
   through with none of what actually matters.
   --------------------------------------------------------------- */
var KINDS={
  maker:{l:'Manufacturer',d:'Makes the material in its own plant.',steps:['pqd','iso','pa']},
  sub:{l:'Subcontractor',d:'Carries out work on the project rather than supplying goods.',steps:['pqd','iso','qms']},
  supplier:{l:'Supplier',d:'Trades or distributes; the material is made by someone else.',steps:['pqd','origin']},
  agency:{l:'Inspection agency',d:'Performs third-party inspection on your behalf.',steps:['appr','scope','iso']}
};
var KIND_OPTS=Object.keys(KINDS).map(function(k){return {v:k,l:KINDS[k].l};});
function kindOf(v){return (v&&KINDS[v.kind])?v.kind:'maker';}

/* ---------- what a vendor must clear ---------- */
var MFR_ROAD=[
 {k:'pqd',n:'Pre-qualification',clause:'2.1.6',
  why:'The vendor and its specific production site are qualified. The evidence reaches SEVEN at least two weeks before any purchase order is placed.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']],
  due:function(v,s){return (s.date&&!settled(s.status))?{on:addDays(s.date,14),t:'purchase order may follow from',soft:true}:null;}},
 {k:'iso',n:'ISO 9001 certificate',clause:'2.1.8',
  why:'Certified to ISO 9001:2015 or equivalent with a live quality system. The certificate alone is not enough — the system itself is evaluated.',
  f:[['ref','Certificate number','text'],['date','Expires','date'],
     ['status','State','sel',['Pending','Valid','Expired']]],
  due:function(v,s){return s.date?{on:s.date,t:'certificate expires'}:null;}},
 {k:'pa',n:'Physical assessment',clause:'2.1.9',
  why:'A survey of the factory by a certified lead auditor with a technical expert. It may be waived for C1 and C2 only.',
  f:[['date','Survey date','date'],['by','Lead assessor','person'],
     ['ref','Report reference','text'],
     ['status','Result','sel',['Pending','Scheduled','Passed','Failed','Waived']]],
  warn:function(v,s){return (v.cat==='C3'&&s.status==='Waived')?'A waiver is allowed for C1 and C2 only. This manufacturer is C3.':'';}},

 {k:'qms',n:'Quality system and procedures',clause:'2.2.9',
  why:'A subcontractor buying on your behalf carries every requirement of this procedure, so its QA/QC plan and procedures are reviewed before it starts.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']]},

 {k:'origin',n:'Maker behind the supply',clause:'2.1.6',
  why:'A trader is qualified through the factory it represents. Name that factory and the approval or agency letter that ties them together.',
  f:[['by','Factory represented','text'],['ref','Approval or agency letter','text'],
     ['date','Dated','date'],['status','Outcome','status']]},

 {k:'appr',n:'SEVEN approval of the agency',clause:'2.2.17',
  why:'Third-party inspectors are assigned by discipline and reviewed and approved by SEVEN before any inspection.',
  f:[['ref','Approval reference','text'],['date','Approved','date'],['status','Outcome','status']]},

 {k:'scope',n:'Accreditation and disciplines',clause:'2.2.17',
  why:'The disciplines the agency is accredited for — mechanical, electrical, civil — and the certificate that says so.',
  f:[['by','Disciplines','text'],['ref','Accreditation','text'],
     ['date','Valid until','date'],['status','State','sel',['Pending','Valid','Expired']]],
  due:function(v,s){return s.date?{on:s.date,t:'accreditation expires'}:null;}}
];
/* Clause 2.1.5 requires manufacturer approval for category 1 and above.
   A C0 maker supplies commodity material reviewed through the submittal
   and inspected on delivery — asking it for a survey and a certificate
   would be inventing work the procedure does not ask for. */
function needsQual(v){
  if(kindOf(v)==='agency')return true;          /* an agency is approved whatever it inspects */
  return v.cat!=='C0';
}
function roadFor(v){
  if(!needsQual(v))return [];
  var want=KINDS[kindOf(v)].steps;
  return want.map(function(k){return MFR_ROAD.find(function(x){return x.k===k;});}).filter(Boolean);
}

/* ---------- what a material must clear ---------- */
var MAT_ROAD=[
 {k:'mts',n:'Technical submittal',cats:'0123',clause:'2.2.2',
  why:'Reviewed and approved before the purchase order is issued.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']]},

 {k:'mfr',n:'Vendor qualified',cats:'123',clause:'2.1.6',
  why:'Approval of the vendor is required before the purchase order for anything above category 0.',
  linked:true},

 {k:'pid',n:'Pre-inspection dossier',cats:'23',clause:'2.2.15',
  why:'Carries the purchase order, the standards, the inspection assignment sheet and the inspection and test plan. Due twenty-one days before fabrication starts.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']],
  due:function(m,s){return s.date?{on:addDays(s.date,21),t:'fabrication may start from',soft:true}:null;}},

 {k:'pfm',n:'Pre-fabrication meeting',cats:'3',clause:'2.2.19',
  why:'Held before fabrication begins. Minutes are due within seven days of the visit.',
  f:[['date','Meeting date','date'],['ref','Minutes reference','text'],
     ['status','Minutes','sel',['Pending','Issued','Approved']]],
  due:function(m,s){return (s.date&&s.status!=='Approved')?{on:addDays(s.date,7),t:'minutes due by'}:null;}},

 {k:'itp',n:'Inspection and test plan',cats:'3',clause:'2.2.10',
  why:'Hold, witness and review points with acceptance criteria and verifying documents, agreed before fabrication.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']]},

 {k:'ipi',n:'In-process inspection',cats:'3',clause:'2.2.5',
  why:'Visits to the factory while the material is being made, against the approved plan.',
  f:[['date','Last visit','date'],['by','Inspector','person'],['ref','Report reference','text'],
     ['status','Result','sel',['Pending','Passed','Passed with comments','Failed']]],
  due:function(m,s){return (s.date&&s.status!=='Pending')?{on:addDays(s.date,7),t:'report due by'}:null;}},

 {k:'fat',n:'Final inspection or FAT',cats:'23',clause:'2.2.17',
  why:'Carried out at the factory before shipping. The report is submitted within seven days of the visit.',
  f:[['date','Inspection date','date'],['by','Inspector','person'],['ref','Report reference','text'],
     ['status','Result','sel',['Pending','Scheduled','Passed','Passed with comments','Failed']]],
  due:function(m,s){return (s.date&&['Passed','Passed with comments','Failed'].indexOf(s.status)>=0)?{on:addDays(s.date,7),t:'report due by'}:null;}},

 {k:'irn',n:'Material release note',cats:'23',clause:'2.2.20',
  why:'Issued at final inspection with every exception and punch item listed. It travels with the goods, and the employer copy is due within forty-eight hours.',
  f:[['ref','Release note number','text'],['date','Issued','date'],
     ['status','Employer copy','sel',['Pending','Sent']]],
  due:function(m,s){return (s.date&&s.status!=='Sent')?{on:addDays(s.date,2),t:'employer copy due by'}:null;}},

 {k:'del',n:'Delivery and site inspection',cats:'0123',clause:'2.2.3',
  why:'Each consignment is inspected on arrival through a material inspection request. A material may arrive in several parts.',
  deliveries:true},

 {k:'post',n:'Post-inspection dossier',cats:'23',clause:'2.2.21',
  why:'The quality record of everything that happened, with every non-conformance carrying its final disposition. Due one week after the last purchase-order quantity is accepted.',
  f:[['ref','Aconex reference','text'],['date','Submitted','date'],['status','Outcome','status']],
  due:function(m,s){var l=lastAccepted(m);return (l&&!settled(s.status))?{on:addDays(l,7),t:'due by'}:null;}}
];

function applies(step,cat){
  var c=String(cat||'').replace('C','');
  return c?step.cats.indexOf(c)>=0:step.cats.indexOf('0')>=0;
}
/* the newest accepted consignment decides when the closing dossier is due */
function lastAccepted(m){
  var d=(m.dels||[]).filter(function(x){return settled(x.status);}).map(function(x){return x.date;}).filter(Boolean).sort();
  return d.length?d[d.length-1]:'';
}
function received(m){return (m.dels||[]).filter(function(d){return settled(d.status);}).reduce(function(a,d){return a+num(d.qty);},0);}
function openNCR(m){return (m.ncrs||[]).filter(function(n){return n.status!=='Closed';}).length;}

function stepState(step,m){
  if(step.linked){
    var v=mfrOf(m);
    if(!v)return 'open';
    var r=mfrRoad(v);
    return r.some(function(x){return x.state==='bad';})?'bad'
      :r.every(function(x){return x.state==='done';})?'done':'wait';
  }
  if(step.deliveries){
    var dels=m.dels||[];
    if(!dels.length)return 'open';
    if(dels.some(function(d){return failed(d.status);}))return 'bad';
    var ord=num(m.qty);
    var all=dels.every(function(d){return settled(d.status);});
    if(all&&(!ord||received(m)>=ord))return 'done';
    return 'wait';
  }
  var s=(m.steps||{})[step.k]||{};
  var st=s.status||'';
  if(!st||st==='Pending')return (s.date||s.ref)?'wait':'open';
  if(failed(st))return 'bad';
  if(settled(st))return 'done';
  return 'wait';
}
function matRoad(m){
  var steps=MAT_ROAD.filter(function(s){return applies(s,m.cat);}).map(function(s){
    return {s:s,state:stepState(s,m),data:(m.steps||{})[s.k]||{}};
  });
  var i=steps.findIndex(function(x){return x.state!=='done';});
  steps.forEach(function(x,j){x.now=(j===i);x.ahead=(i>=0&&j>i);});
  return {steps:steps,at:i,done:steps.filter(function(x){return x.state==='done';}).length};
}
function mfrRoad(v){
  var steps=roadFor(v).map(function(s){
    var d=(v.steps||{})[s.k]||{};
    var st=d.status||'';
    var state;
    if(s.k==='iso'||s.k==='scope'){
      state=(st==='Valid')?(d.date&&daysTo(d.date)<0?'bad':'done'):(st==='Expired'?'bad':(d.ref||d.date?'wait':'open'));
    }else{
      state=(!st||st==='Pending')?((d.date||d.ref)?'wait':'open'):failed(st)?'bad':settled(st)?'done':'wait';
    }
    /* the survey is a factory visit for C1 to C3; below that, nothing to see */
    if(s.k==='pa'&&v.cat&&['C1','C2','C3'].indexOf(v.cat)<0)state='done';
    return {s:s,state:state,data:d};
  });
  var i=steps.findIndex(function(x){return x.state!=='done';});
  steps.forEach(function(x,j){x.now=(j===i);x.ahead=(i>=0&&j>i);});
  return steps;
}
</script>

}
/* Sorting puts the worst first, which answers "what is urgent"; it does
   not answer "show me only the ones still open". These are the states a
   record can actually be in, so nothing here is invented. */
var FILTER={mat:'all',mfr:'all',insp:'all'};
function matBucket(m){
  var r=matRoad(m);
  if(r.steps.some(function(x){return x.state==='bad';}))return 'blocked';
  if(r.at<0)return 'done';
  return r.steps[r.at].state==='wait'?'waiting':'open';
}
function mfrBucket(v){
  if(!needsQual(v))return 'exempt';
  var ms=mfrState(v);
  if(ms.tone==='bad')return 'blocked';
  if(ms.ok)return 'done';
  var r=mfrRoad(v);
